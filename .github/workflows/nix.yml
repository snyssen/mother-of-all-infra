name: Check nix flake
# This job is mainly in place so renovate can do branch automerge, as it needs a successful check.
# It then doubles as a sanity check on the flake quality
on:
  # pull_request:
  push:
    # branches:
    #   - main

jobs:
  build:
    name: Check nix flake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@2e32b6dce651e6992cc110d569e0b60746e31b48 # main
