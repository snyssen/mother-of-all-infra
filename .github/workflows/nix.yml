name: Check nix flake
# This job is mainly in place so renovate can do branch automerge, as it needs a successful check.
# It then doubles as a sanity check on the flake quality
on:
  # pull_request:
  push:
    # branches:
    #   - main

jobs:
  build:
    name: Check nix flake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # main
