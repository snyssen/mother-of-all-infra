name: Check nix flake
# This job is mainly in place so renovate can do branch automerge, as it needs a successful check.
# It then doubles as a sanity check on the flake quality
on:
  # pull_request:
  push:
    # branches:
    #   - main

jobs:
  build:
    name: Check nix flake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@a0f068d37b542f3150564fbf1164fec2d958ee11 # main
