name: Build and Cache Flake Outputs

on:
  pull_request:
    paths:
      - "flake.lock"
      - "flake.nix"
      - "nix/devshell.nix"
  push:
    branches:
      - main
    paths:
      - "flake.lock"
      - "flake.nix"
      - "nix/devshell.nix"

jobs:
  build-and-cache:
    runs-on: ubuntu-latest
    name: Build hosts and devshell
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Clear space for Nix
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: "Log runner's IP"
        run: |
          curl ifconfig.me || true
      - name: Configure Attic
        run: |
          nix profile install github:zhaofengli/attic
          mkdir -p ~/.config/attic
          attic login "${{ secrets.ATTIC_CACHE }}" "${{ secrets.ATTIC_ENDPOINT }}" "${{ secrets.ATTIC_CI_TOKEN }}"
          attic use "${{ secrets.ATTIC_CACHE }}"

      - name: Build NixOS configurations and devshell
        run: |
          mkdir -p build-results
          build_has_failures=0
          build_result_files=()
          build_failed_targets=()

          build_targets=(
            ".#nixosConfigurations.gaming.config.system.build.toplevel"
            ".#nixosConfigurations.ingress.config.system.build.toplevel"
            ".#nixosConfigurations.purplehaze.config.system.build.toplevel"
            ".#nixosConfigurations.sninful.config.system.build.toplevel"
            ".#nixosConfigurations.blackfog.config.system.build.toplevel"
            ".#devShells.x86_64-linux.default"
          )

          for target in "${build_targets[@]}"; do
            target_name=$(echo "$target" | sed 's|^.#||; s|[^a-zA-Z0-9._-]|_|g')
            target_result_file="build-results/${target_name}.json"

            echo "Building $target..."
            if nix build --json --print-build-logs "$target" > "$target_result_file"; then
              build_result_files+=("$target_result_file")
            else
              build_has_failures=1
              build_failed_targets+=("$target")
            fi
          done

          printf '%s\n' "${build_result_files[@]}" > build-results/successful-result-files.txt
          printf '%s\n' "${build_failed_targets[@]}" > build-results/failed-targets.txt
          echo "$build_has_failures" > build-results/build-has-failures.txt

      - name: Push outputs to Attic cache
        run: |
          if [ ! -s build-results/successful-result-files.txt ]; then
            echo "No successful build results found to push."
          else
            mapfile -t SUCCESS_FILES < build-results/successful-result-files.txt

            RESULTS=$(jq -rs -r '
              [
                .[] | .[]? | .outputs? | to_entries[]? | .value
              ] | unique[]?
            ' "${SUCCESS_FILES[@]}")

            if [ -z "$RESULTS" ]; then
              echo "No outputs found in successful build results."
            else
              echo "$RESULTS" | while IFS= read -r result; do
                [ -n "$result" ] || continue
                echo "Pushing $result to Attic..."
                attic push "${{ secrets.ATTIC_CACHE }}" "$result" \
                  || echo "[WARNING] Failed to push (parts of) '$result' to Attic."
              done
            fi
          fi

          if [ "$(cat build-results/build-has-failures.txt)" = "1" ]; then
            echo "The following targets failed to build:"
            sed 's/^/- /' build-results/failed-targets.txt
            exit 1
          fi

      - name: Upload build results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-results
          path: build-results/
          retention-days: 7
