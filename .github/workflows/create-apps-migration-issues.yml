            const bkp_ui = await mkIssue(
              '[Apps Migration] [Backup] (Optional) Deploy backrest as read-only backup browser',
              `## Objective
            Optionally provide a web UI for browsing restic snapshots. The primary backup mechanism is \`services.restic.backups\`; this is purely a convenience for inspecting what has been backed up.

            ## Context
            The current bare-metal host runs the \`backrest\` container stack, but it requires manual sync to see up-to-date snapshots (not ideal but acceptable — one-click). Actual restores are done via the \`restic\` CLI directly on the host to avoid Docker volume mapping complexities.

            ## Acceptance Criteria (if implemented)
            - [ ] \`backrest\` compose stack deployed at \`nix/hosts/apps/compose/backrest/docker-compose.yaml\`
            - [ ] Backrest configured in read-only / browse mode pointing to the restic repository
            - [ ] Access restricted (not publicly exposed, or behind auth)
            - [ ] Actual restores continue to be done via \`restic\` CLI on the host (documented)

            ## Notes
            - This issue is **optional** — skip if the \`restic\` CLI is sufficient for browsing
            - Consider whether \`restic mount\` (FUSE) is a simpler alternative for ad-hoc browsing`
            );

            // ────────────────────────────────────────────────────────────────────
            // CUTOVER STRATEGY
            // ────────────────────────────────────────────────────────────────────

            const cut_testbed = await mkIssue(
              '[Apps Migration] [Cutover] Deploy testbed apps VM on current hypervisor (minimum viable system)',
              `## Objective
            Once the base NixOS configuration is code-complete, deploy the apps VM on the current (testbed) hypervisor hardware and bring up a minimal set of stacks to validate the full end-to-end configuration.

            ## Acceptance Criteria
            - [ ] NixOS installed on the VM using \`just nix-remote-install apps\` (nixos-anywhere)
            - [ ] \`hardware-configuration.nix\` generated and committed
            - [ ] VM boots, Tailscale connects, NFS mount \`/mnt/bulk\` works
            - [ ] At least the \`databases\` and \`backbone\` stacks start successfully
            - [ ] Monitoring stack scrapes node exporter and cAdvisor from the apps VM
            - [ ] Traefik on ingress can proxy to at least one service on the apps VM

            ## Notes
            - Use minimal/synthetic test data — no production data migration at this stage
            - This is Phase A of the two-phase migration strategy
            - Phase B (full production cutover with hardware migration) is tracked separately
            - Any configuration issues discovered here should be fixed before proceeding`
            );

            const cut_restore = await mkIssue(
              '[Apps Migration] [Cutover] Run partial restore tests on testbed',
              `## Objective
            Validate that data can be successfully restored from the current apps host backups to the testbed apps VM, as a rehearsal for the eventual full production cutover.

            ## Acceptance Criteria
            - [ ] Restic repository accessible from testbed apps VM
            - [ ] Partial restore test: restore \`/var/lib/app-data\` for at least 2-3 stacks (e.g., \`nextcloud\`, \`immich\`)
            - [ ] Stacks start successfully with restored data and data integrity confirmed
            - [ ] Restore procedure documented in \`docs/hypervisor/apps-migration-plan.md\`
            - [ ] Estimated restore time noted (important for planning the production cutover window)

            ## Notes
            - Partial restores help identify any path mapping issues before the full cutover
            - The VPN/streaming stack (\`streaming\`) needs special attention due to \`NET_ADMIN\` + \`/dev/net/tun\`
            - Results of this test will inform the go/no-go decision for Phase B`
            );

            const cut_production = await mkIssue(
              '[Apps Migration] [Cutover] [Future] Full production cutover: hardware migration and data restore',
              `## Objective
            Complete the final production migration once Phase A (testbed) is validated. This involves moving the hypervisor config to the production hardware (current apps server) and recreating all VMs with full data restore.

            > ⚠️ **This is a future issue** — do not begin until testbed validation and partial restore tests are complete and signed off.

            ## Background
            The current apps server (bare-metal Ubuntu, snyssen.be) runs on the best available hardware. The final state is:
            1. Hypervisor NixOS config deployed to the current apps server hardware
            2. All VMs (including apps) recreated on the new hypervisor
            3. Full data restore from the last backup of the bare-metal host

            ## High-Level Steps (to be detailed when this issue is activated)
            1. Take a final full backup of the bare-metal apps host (\`autorestic backup\`)
            2. Wipe the bare-metal apps server and install the hypervisor NixOS config
            3. Recreate all VMs on the new hypervisor (\`libvirt_provision\`)
            4. Restore all data from backup to the apps VM
            5. Update DNS / Traefik to point to the new VM IPs
            6. Verify all stacks are healthy
            7. Decommission or repurpose the old testbed hypervisor hardware

            ## Notes
            - Expected downtime: several hours to a few days
            - DNS migration to dedicated VM is a **separate** future effort (not in scope here)
            - Once this issue is complete, the bare-metal Ubuntu host is fully decommissioned`
            );

            // ────────────────────────────────────────────────────────────────────
            // EPIC — Main tracking issue (created last so it can link to all sub-issues)
            // ────────────────────────────────────────────────────────────────────

            const epicBody = `## Goal
            Migrate the current bare-metal Ubuntu apps host (\`snyssen.be\`, Ansible-managed) to a NixOS virtual machine named \`apps\`, running under the \`hypervisor\` KVM host. The migration should preserve all running services and data while modernising the deployment model to use NixOS declarative configuration.

            ## Key Design Decisions
            | Decision | Value |
            |----------|-------|
            | VM hostname | \`apps\` |
            | Local app data (OS disk) | \`/var/lib/app-data\` |
            | Bulk storage mount | \`/mnt/bulk\` → NFS \`hypervisor:/mnt/bulk/apps\` |
            | Compose file name | \`docker-compose.yaml\` |
            | Compose file path | \`nix/hosts/apps/compose/<stack>/docker-compose.yaml\` |
            | Docker networks | \`web\`, \`db\`, \`ldap\`, \`monitoring\` (bridge); \`lan\` ipvlan **not** recreated |
            | Monitoring | Native NixOS modules: node-exporter + alloy + cAdvisor |
            | Backups | \`services.restic.backups\` + optional backrest UI; restores via CLI |
            | VM provisioning | \`libvirt_provision\` Ansible role on hypervisor |
            | DNS migration | **Out of scope** — separate future effort |
            | Unifi | **Out of scope** — dedicated Unifi OS Server VM |

            ## Migration Strategy (two-phase)
            - **Phase A (this epic):** Code-complete the apps VM NixOS config and validate on the current testbed hypervisor with minimal/partial data
            - **Phase B (future):** Full production cutover when moving hypervisor to production hardware

            ## Sub-Issues

            ### Phase 0 — Planning & Inventory
            - #${p0_plan.number} — Create and maintain migration planning document
            - #${p0_inventory.number} — Inventory stacks, data paths, inter-dependencies, and secrets

            ### Hypervisor Changes
            - #${hyp_nfs.number} — Add NFS export \`/mnt/bulk/apps\`
            - #${hyp_vm.number} — Provision \`apps\` VM via \`libvirt_provision\`
            - #${hyp_net.number} — Validate VM bridge network (\`br0\`) connectivity

            ### Apps VM Base NixOS Configuration
            - #${base_skeleton.number} — Create base NixOS configuration skeleton
            - #${base_disko.number} — Configure disko layout (\`single-btrfs-luks-virtiofs-key\`)
            - #${base_sops.number} — Create SOPS secrets file
            - #${base_tailscale.number} — Configure Tailscale
            - #${base_monitoring.number} — Configure monitoring (node-exporter + alloy + cAdvisor)
            - #${base_firewall.number} — Configure firewall and CrowdSec
            - #${base_docker.number} — Configure Docker and app data paths
            - #${base_nfs.number} — Configure NFS bulk storage mount (\`/mnt/bulk\`)

            ### Supporting NixOS Modules
            - #${mod_networks.number} — Create \`docker-networks\` NixOS module
            - #${mod_cadvisor.number} — Create \`cadvisor\` NixOS module

            ### Stack Migration
            - #${stacks_tracker.number} — Stack migration tracker + per-stack issue template

            ### Backup Configuration
            - #${bkp_restic.number} — Configure \`services.restic.backups\`
            - #${bkp_sops.number} — Define restic credentials via SOPS
            - #${bkp_hooks.number} — Configure pre/post backup hooks (database dumps)
            - #${bkp_ui.number} — (Optional) Deploy backrest as read-only backup browser

            ### Cutover Strategy
            - #${cut_testbed.number} — Deploy testbed apps VM (minimum viable system)
            - #${cut_restore.number} — Run partial restore tests on testbed
            - #${cut_production.number} — [Future] Full production cutover

            ## Assumptions
            - The hypervisor hardware is already running and VMs are being managed via \`libvirt_provision\`
            - The btrfs \`vmstore\` SSD pool on the hypervisor has sufficient space for a new VM disk
            - The btrfs \`bulk\` HDD pool has sufficient space for \`/mnt/bulk/apps\`
            - Tailscale is available for secure inter-VM communication
            - The ingress host's Traefik will continue to handle public traffic routing`;

            const epic = await mkIssue(
              '[EPIC] Migrate apps host: bare-metal Ubuntu (snyssen.be) → NixOS VM',
              epicBody
            );

