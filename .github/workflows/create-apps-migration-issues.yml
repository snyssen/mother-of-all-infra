            const bkp_hooks = await mkIssue(
              '[Apps Migration] [Backup] Configure pre/post backup hooks (database dumps)',
              `## Objective
            Ensure databases are dumped to disk before restic backs up the data directory, and that dump files are cleaned up after backup.

            ## Acceptance Criteria
            - [ ] Pre-backup hook: dump all PostgreSQL databases to \`/var/lib/app-data/backups/postgres/\`
            - [ ] Pre-backup hook: dump all MySQL/MariaDB databases (if any) similarly
            - [ ] Post-backup hook: remove dump files after successful backup (or retain last N)
            - [ ] Hooks configured via \`services.restic.backups.<name>.backupPrepareCommand\` and \`backupCleanupCommand\`
