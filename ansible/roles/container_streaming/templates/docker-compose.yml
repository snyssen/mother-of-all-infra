services:
  jellyfin:
    image: ghcr.io/jellyfin/jellyfin:10.11.8@sha256:93227545077893cc9516f28b3adb733b67bc4691f41b6167428a2a0e3220b81c
    restart: unless-stopped
    container_name: jellyfin
    networks:
      - web
      - monitoring
      - ldap
    user: "33:{{ ansible_user_gid }}"
    environment:
      - JELLYFIN_DATA_DIR=/data
      - JELLYFIN_CONFIG_DIR=/config
      - JELLYFIN_CACHE_DIR=/cache
      - JELLYFIN_LOG_DIR=/logs

      - JELLYFIN_PublishedServerUrl=https://streaming.{{ main_domain }}
      - JELLYFIN_playlists__allowDuplicates=false
    devices:
      - /dev/dri:/dev/dri # allow use of Intel QuickSync for transcoding
    group_add:
      - "109" # Adds render group
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.jellyfin.entryPoints=websecure
      - traefik.http.routers.jellyfin.rule=Host(`streaming.{{ main_domain }}`) && !Path(`/metrics`)
      - traefik.http.services.jellyfin.loadBalancer.server.port=8096
      # jellyfin middleware, see https://jellyfin.org/docs/general/networking/traefik2.html
      - traefik.http.routers.jellyfin.middlewares=jellyfin-mw
      - traefik.http.middlewares.jellyfin-mw.headers.customResponseHeaders.X-Robots-Tag=noindex,nofollow,nosnippet,noarchive,notranslate,noimageindex
      - traefik.http.middlewares.jellyfin-mw.headers.SSLRedirect=true
      - traefik.http.middlewares.jellyfin-mw.headers.SSLHost=streaming.{{ main_domain }}
      - traefik.http.middlewares.jellyfin-mw.headers.SSLForceHost=true
      - traefik.http.middlewares.jellyfin-mw.headers.STSSeconds=315360000
      - traefik.http.middlewares.jellyfin-mw.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.jellyfin-mw.headers.STSPreload=true
      - traefik.http.middlewares.jellyfin-mw.headers.forceSTSHeader=true
      - traefik.http.middlewares.jellyfin-mw.headers.frameDeny=true
      - traefik.http.middlewares.jellyfin-mw.headers.contentTypeNosniff=true
      - traefik.http.middlewares.jellyfin-mw.headers.browserXSSFilter=true
      - traefik.http.middlewares.jellyfin-mw.headers.customFrameOptionsValue='allow-from https://streaming.{{ main_domain }}'

      - traefik.udp.routers.jellyfin-discovery.entryPoints=jellyfin-discovery
      - traefik.udp.routers.jellyfin-discovery.service=jellyfin-discovery
      - traefik.udp.services.jellyfin-discovery.loadBalancer.server.port=7359
      # TODO: fix DLNA (should be exposed as physical device)
      # - traefik.udp.routers.dlna.entryPoints=dlna
      # - traefik.udp.routers.dlna.service=dlna
      # - traefik.udp.services.dlna.loadBalancer.server.port=1900
    volumes:
      - "{{ docker_mounts_directory }}/jellyfin/data:/data"
      - "{{ docker_mounts_directory }}/jellyfin/config:/config"
      - "{{ docker_mounts_directory }}/jellyfin/cache:/cache"
      - "{{ docker_mounts_directory }}/jellyfin/logs:/logs"
      # all below refer to media folders
      - /mnt/storage/streaming/media:/data/media

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.34.0@sha256:4143292c530f6ac6700afd13360c04f477e4f1a81c1c97c4224b1c7e4330c5c4
    restart: unless-stopped
    container_name: audiobookshelf
    networks:
      - web
    user: "33:{{ ansible_user_gid }}"
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.audiobookshelf.entryPoints=websecure
      - traefik.http.routers.audiobookshelf.rule=Host(`audiobooks.{{ main_domain }}`)
    volumes:
      - /mnt/storage/streaming/media/audiobooks:/audiobooks
      - /mnt/storage/streaming/media/audiobooks_vi:/audiobooks_vi
      - /mnt/storage/streaming/media/podcasts:/podcasts
      - /mnt/storage/streaming/media/podcasts_vi:/podcasts_vi
      - "{{ docker_mounts_directory }}/audiobookshelf/config:/config"
      - "{{ docker_mounts_directory }}/audiobookshelf/metadata:/metadata"

  torrent:
    image: lscr.io/linuxserver/transmission:4.1.1@sha256:62a88fbc210fc62d867eab9c67a0f5474db7257013ce598173a9efc1043e97b8
    container_name: torrent
    network_mode: container:vpn
    environment:
      - PUID=33
      - PGID={{ ansible_user_gid }}
      - TZ={{ iana_timezone }}
    volumes:
      - /mnt/storage/torrent:/config
      - /mnt/storage/streaming/torrent:/data/torrent
    restart: unless-stopped
    mem_limit: 712m

  usenet:
    image: lscr.io/linuxserver/sabnzbd:5.0.1@sha256:05c14b2823f5c3b154e73069827ed4645f116e8ab0fc80feb53dfca13b019b88
    container_name: usenet
    network_mode: container:vpn
    environment:
      - PUID=33
      - PGID={{ ansible_user_gid }}
      - TZ={{ iana_timezone }}
    volumes:
      - /mnt/storage/usenet:/config
      - /mnt/storage/streaming/usenet:/data/usenet
    restart: unless-stopped
    mem_limit: 256m

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.17@sha256:60f3b6b5c7647ba2bafd81163acfe34b11117b9b834ebd7fbcc3e5f1b309c7ef
    container_name: sonarr
    environment:
      - PUID=33
      - PGID={{ ansible_user_gid}}
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.entryPoints=websecure
      - traefik.http.routers.sonarr.rule=Host(`sonarr.{{ main_domain }}`)
      - traefik.http.services.sonarr.loadBalancer.server.port=8989
      - traefik.http.routers.sonarr.middlewares=authelia@docker
    volumes:
      - "{{ docker_mounts_directory }}/sonarr/config:/config"
      - /mnt/storage/streaming:/data
    restart: unless-stopped
    mem_limit: 1g

  radarr:
    image: lscr.io/linuxserver/radarr:6.1.1@sha256:15417a594ebda4c660a9fa9748e7199d33e2d17b31bbc5ad7ba2e86f0b414763
    container_name: radarr
    environment:
      - PUID=33
      - PGID={{ ansible_user_gid }}
      - TZ=Europe/Brussels
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.entryPoints=websecure
      - traefik.http.routers.radarr.rule=Host(`radarr.{{ main_domain }}`)
      - traefik.http.services.radarr.loadBalancer.server.port=7878
      - traefik.http.routers.radarr.middlewares=authelia@docker
    volumes:
      - "{{ docker_mounts_directory }}/radarr/config:/config"
      - /mnt/storage/streaming:/data
    restart: unless-stopped
    mem_limit: 1g

  lidarr:
    image: lscr.io/linuxserver/lidarr:8.1.2135@sha256:8455e2c2f3a7e0fb56ab4de6be924d81aa441bfe9a740cf110d46b25a39b42ba
    container_name: lidarr
    environment:
      - PUID=33
      - PGID={{ ansible_user_gid}}
      - TZ=Europe/Brussels
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.lidarr.entryPoints=websecure
      - traefik.http.routers.lidarr.rule=Host(`lidarr.{{ main_domain }}`)
      - traefik.http.services.lidarr.loadBalancer.server.port=8686
      - traefik.http.routers.lidarr.middlewares=authelia@docker
    volumes:
      - "{{ docker_mounts_directory }}/lidarr/config:/config"
      - /mnt/storage/streaming:/data
    restart: unless-stopped
    mem_limit: 1g

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.3.5@sha256:4b52038b7b6452a20c145239fa07d8218d1541d736a96c43aa0a5f60141cab28
    container_name: prowlarr
    environment:
      - PUID=33
      - PGID={{ ansible_user_gid}}
      - TZ=Europe/Brussels
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.prowlarr.entryPoints=websecure
      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.{{ main_domain }}`)
      - traefik.http.services.prowlarr.loadBalancer.server.port=9696
      - traefik.http.routers.prowlarr.middlewares=authelia@docker
    volumes:
      - "{{ docker_mounts_directory }}/prowlarr/config:/config"
    restart: unless-stopped
    mem_limit: 1g

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.5.6@sha256:4b7bb6d861c08bbf0c388b936ada8b2ba57669ca9974323f504e974577d19d63
    container_name: bazarr
    environment:
      - PUID=33
      - PGID={{ ansible_user_gid}}
      - TZ=Europe/Brussels
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.bazarr.entryPoints=websecure
      - traefik.http.routers.bazarr.rule=Host(`bazarr.{{ main_domain }}`)
      - traefik.http.services.bazarr.loadBalancer.server.port=6767
      - traefik.http.routers.bazarr.middlewares=authelia@docker
    volumes:
      - "{{ docker_mounts_directory }}/bazarr/config:/config"
      - /mnt/storage/streaming:/data
    restart: unless-stopped
    mem_limit: 1g

  pinchflat:
    image: ghcr.io/kieraneglin/pinchflat:v2025.6.6@sha256:4e975edf58f0861a5cbfe8fc6aac4851ff5a02dfc3f05ffeea4982e3084a5a4a
    container_name: pinchflat
    user: "33:{{ ansible_user_gid }}"
    restart: unless-stopped
    environment:
      # Set the timezone to your local timezone
      - TZ={{ iana_timezone }}
    network_mode: container:vpn
    volumes:
      - "{{ docker_mounts_directory }}/pinchflat/config:/config"
      - /mnt/storage/streaming/media/tv:/downloads

  lidatube:
    image: thewicklowwolf/lidatube:0.2.51@sha256:057c89fa90aa7fd82a8c516daca31798bbb6c19e218dd87fde2a7232e8bb7481
    container_name: lidatube
    environment:
      - PUID=33
      - PGID={{ ansible_user_gid}}
    volumes:
      - "{{ docker_mounts_directory }}/lidatube/config:/lidatube/config"
      - /mnt/storage/streaming/media/music:/lidatube/downloads
      - /etc/localtime:/etc/localtime:ro
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.lidatube.entryPoints=websecure
      - traefik.http.routers.lidatube.rule=Host(`lidatube.{{ main_domain }}`)
      - traefik.http.services.lidatube.loadBalancer.server.port=5000
      - traefik.http.routers.lidatube.middlewares=authelia@docker
    restart: unless-stopped

  lidify:
    image: thewicklowwolf/lidify:0.2.9@sha256:d9968f2eebe30e28448f94f8f7198b3bc9ee06e950434b659e10b4d46dfeaac3
    container_name: lidify
    environment:
      - PUID=33
      - PGID={{ ansible_user_gid}}
    volumes:
      - "{{ docker_mounts_directory }}/lidify/config:/lidify/config"
      - /etc/localtime:/etc/localtime:ro
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.lidify.entryPoints=websecure
      - traefik.http.routers.lidify.rule=Host(`lidify.{{ main_domain }}`)
      - traefik.http.services.lidify.loadBalancer.server.port=5000
      - traefik.http.routers.lidify.middlewares=authelia@docker
    restart: unless-stopped

  peertube:
    image: chocobozzz/peertube:production-bookworm@sha256:011b0ec43d921bd60a3aa01fc7995e42cf15275925f16bee6f17a6c896ca5060
    container_name: peertube
    restart: unless-stopped
    networks:
      - web
      - monitoring
      - db
      - peertube_internal
    environment:
      - PEERTUBE_DB_USERNAME={{ peertube__db_username }}
      - PEERTUBE_DB_PASSWORD={{ peertube__db_password }}
      - PEERTUBE_DB_HOSTNAME=postgres
      - PEERTUBE_DB_NAME=peertube
      - PEERTUBE_DB_SSL=false
      - PEERTUBE_REDIS_HOSTNAME=peertube_redis
      - PEERTUBE_WEBSERVER_HOSTNAME=peertube.{{ main_domain }}
      - PEERTUBE_WEBSERVER_HTTPS=true
      # Trust proxy configuration - includes localhost, loopback, and Docker bridge network
      # Adjust peertube__trust_proxy_networks variable if your Docker network uses a different subnet
      - PEERTUBE_TRUST_PROXY={{ peertube__trust_proxy_networks | default('["127.0.0.1", "loopback", "172.18.0.0/16"]') }}
      - PEERTUBE_SECRET={{ peertube__secret }}
      - PEERTUBE_SMTP_HOSTNAME={{ smtp__host }}
      - PEERTUBE_SMTP_PORT={{ smtp__port }}
      - PEERTUBE_SMTP_USERNAME={{ smtp__user }}
      - PEERTUBE_SMTP_PASSWORD={{ smtp__pass }}
      - PEERTUBE_SMTP_FROM=peertube@{{ main_domain }}
      - PEERTUBE_SMTP_TLS={{ smtp__tls | lower }}
      - PEERTUBE_SMTP_DISABLE_STARTTLS={{ smtp__ssl | lower }}
      - PEERTUBE_ADMIN_EMAIL={{ smtp__to }}
      # OIDC configuration for Authelia integration
      # TODO: remove ? This is most probably useless as I think config cazn only be done through UI
      - PEERTUBE_PLUGIN_OFFICIAL_AUTH_OPENID_CONNECT_ENABLED={{ peertube__oidc_enabled | default('true') }}
      - PEERTUBE_PLUGIN_OFFICIAL_AUTH_OPENID_CONNECT_BUTTON_LABEL={{ peertube__oidc_button_label | default('Login with Authelia') }}
      - PEERTUBE_PLUGIN_OFFICIAL_AUTH_OPENID_CONNECT_DISCOVER_URL=https://auth.{{ main_domain }}/.well-known/openid-configuration
      - PEERTUBE_PLUGIN_OFFICIAL_AUTH_OPENID_CONNECT_CLIENT_ID={{ peertube__oidc_client_id }}
      - PEERTUBE_PLUGIN_OFFICIAL_AUTH_OPENID_CONNECT_CLIENT_SECRET={{ peertube__oidc_client_secret }}
      - PEERTUBE_PLUGIN_OFFICIAL_AUTH_OPENID_CONNECT_SCOPE=openid profile email groups
      - PEERTUBE_PLUGIN_OFFICIAL_AUTH_OPENID_CONNECT_USERNAME_PROPERTY=preferred_username
      - PEERTUBE_PLUGIN_OFFICIAL_AUTH_OPENID_CONNECT_EMAIL_PROPERTY=email
      - PEERTUBE_PLUGIN_OFFICIAL_AUTH_OPENID_CONNECT_DISPLAY_NAME_PROPERTY=name
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.peertube.entryPoints=websecure
      - traefik.http.routers.peertube.rule=Host(`peertube.{{ main_domain }}`)
      - traefik.http.services.peertube.loadBalancer.server.port=9000
    volumes:
      - "/mnt/storage/streaming/peertube/data:/data"
      - "{{ docker_mounts_directory }}/peertube/config:/config"
    depends_on:
      - peertube_redis

  peertube_redis:
    image: redis:8-alpine@sha256:d146f83b1e0f02fc27c26a50cee39338c736674c5959db84363e6ae3cd9e02d2
    container_name: peertube_redis
    restart: unless-stopped
    networks:
      - peertube_internal
    volumes:
      - "{{ docker_mounts_directory }}/peertube/redis:/data"

networks:
  web:
    external: true
  monitoring:
    external: true
  ldap:
    external: true
  db:
    external: true
  peertube_internal:
