services:
  dashboard:
    image: ghcr.io/snyssen/webb-launcher:3.0.12@sha256:aab14a83e7b8df3856317c4560fbf8432983b8ab7c3df3c39671aab62da2f805
    restart: unless-stopped
    container_name: dashboard
    networks:
      - web
    env_file:
      - ./.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.entryPoints=websecure
      - traefik.http.routers.dashboard.rule=Host(`dash.{{ main_domain }}`)
      - traefik.http.routers.dashboard.middlewares=traefik-compress
    mem_limit: 48m

networks:
  web:
    external: true
