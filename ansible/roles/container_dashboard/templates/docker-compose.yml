services:
  dashboard:
    image: ghcr.io/snyssen/webb-launcher:3.0.13@sha256:d76fc7d2f1acbc156d4f5bbfb927ad41da932b4d4218d9956b919e7331e95526
    restart: unless-stopped
    container_name: dashboard
    networks:
      - web
    env_file:
      - ./.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.entryPoints=websecure
      - traefik.http.routers.dashboard.rule=Host(`dash.{{ main_domain }}`)
      - traefik.http.routers.dashboard.middlewares=traefik-compress
    mem_limit: 48m

networks:
  web:
    external: true
