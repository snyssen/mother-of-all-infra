services:
  dashboard:
    image: ghcr.io/snyssen/webb-launcher:3.0.7@sha256:24bcfd9ffae77059f3c7f3942952befd45594c6426128d3d3b8516d8710d5b55
    restart: unless-stopped
    container_name: dashboard
    networks:
      - web
    env_file:
      - ./.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.entryPoints=websecure
      - traefik.http.routers.dashboard.rule=Host(`dash.{{ main_domain }}`)
      - traefik.http.routers.dashboard.middlewares=traefik-compress
    mem_limit: 48m

networks:
  web:
    external: true
