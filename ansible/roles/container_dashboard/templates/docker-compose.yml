services:
  dashboard:
    image: ghcr.io/snyssen/webb-launcher:3.0.5@sha256:748f5d5e3d22364074f9d57b19706d0cfe439a6ada341d58c1b6d32085c7ac7d
    restart: unless-stopped
    container_name: dashboard
    networks:
      - web
    env_file:
      - ./.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.entryPoints=websecure
      - traefik.http.routers.dashboard.rule=Host(`dash.{{ main_domain }}`)
      - traefik.http.routers.dashboard.middlewares=traefik-compress
    mem_limit: 48m

networks:
  web:
    external: true
