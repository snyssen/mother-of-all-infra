services:
  dashboard:
    image: ghcr.io/snyssen/webb-launcher:3.0.8@sha256:2051ca6c1a4ecd2036989811888cb6758d4adf7028bf165995f82bbcabdaea2e
    restart: unless-stopped
    container_name: dashboard
    networks:
      - web
    env_file:
      - ./.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.entryPoints=websecure
      - traefik.http.routers.dashboard.rule=Host(`dash.{{ main_domain }}`)
      - traefik.http.routers.dashboard.middlewares=traefik-compress
    mem_limit: 48m

networks:
  web:
    external: true
