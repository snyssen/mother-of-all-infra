services:
  dashboard:
    image: ghcr.io/snyssen/webb-launcher:3.0.6@sha256:186aa513895ce53786a9c26e4b55db5397aab05db610fd92ffc371cda5338258
    restart: unless-stopped
    container_name: dashboard
    networks:
      - web
    env_file:
      - ./.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.entryPoints=websecure
      - traefik.http.routers.dashboard.rule=Host(`dash.{{ main_domain }}`)
      - traefik.http.routers.dashboard.middlewares=traefik-compress
    mem_limit: 48m

networks:
  web:
    external: true
