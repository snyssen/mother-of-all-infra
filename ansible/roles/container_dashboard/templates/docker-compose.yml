services:
  dashboard:
    image: ghcr.io/snyssen/webb-launcher:3.0.9@sha256:5322f49aeedcc2cd5981a19afb343f2d933cf38ea9bb5bfe9677929a0f7a5177
    restart: unless-stopped
    container_name: dashboard
    networks:
      - web
    env_file:
      - ./.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.entryPoints=websecure
      - traefik.http.routers.dashboard.rule=Host(`dash.{{ main_domain }}`)
      - traefik.http.routers.dashboard.middlewares=traefik-compress
    mem_limit: 48m

networks:
  web:
    external: true
