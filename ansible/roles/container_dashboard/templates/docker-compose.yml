services:
  dashboard:
    image: ghcr.io/snyssen/webb-launcher:3.0.3@sha256:bdd7d23a47b03c5d1ba521f49f83607054bbb1a981ce68295f5628b9a428e4d2
    restart: unless-stopped
    container_name: dashboard
    networks:
      - web
    env_file:
      - ./.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.entryPoints=websecure
      - traefik.http.routers.dashboard.rule=Host(`dash.{{ main_domain }}`)
      - traefik.http.routers.dashboard.middlewares=traefik-compress
    mem_limit: 48m

networks:
  web:
    external: true
