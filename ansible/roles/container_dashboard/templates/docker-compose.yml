services:
  dashboard:
    image: ghcr.io/snyssen/webb-launcher:3.0.4@sha256:158110f85becab8372618bdb47d381dc47a1707561c1cf5662fee20c60087a73
    restart: unless-stopped
    container_name: dashboard
    networks:
      - web
    env_file:
      - ./.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.entryPoints=websecure
      - traefik.http.routers.dashboard.rule=Host(`dash.{{ main_domain }}`)
      - traefik.http.routers.dashboard.middlewares=traefik-compress
    mem_limit: 48m

networks:
  web:
    external: true
