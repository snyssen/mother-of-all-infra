services:
  dashboard:
    image: ghcr.io/snyssen/webb-launcher:3.0.10@sha256:2ae86461b6ab5b9f7b77b29d9fa07e551143b1102910ff39f9d2aa7dd52a9c3f
    restart: unless-stopped
    container_name: dashboard
    networks:
      - web
    env_file:
      - ./.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.entryPoints=websecure
      - traefik.http.routers.dashboard.rule=Host(`dash.{{ main_domain }}`)
      - traefik.http.routers.dashboard.middlewares=traefik-compress
    mem_limit: 48m

networks:
  web:
    external: true
