metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = {{ garage__replication_factor }}

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"
rpc_secret = "{{ garage__rpc_secret }}"

bootstrap_peers = []

[s3_api]
s3_region = "{{ garage__s3_region }}"
api_bind_addr = "[::]:3900"
root_domain = ".{{ garage__s3_subdomain }}.{{ main_domain }}"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "{{ garage__admin_token }}"
metrics_token = "{{ garage__metrics_token }}"
