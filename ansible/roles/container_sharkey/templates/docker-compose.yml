services:
  sharkey:
    image: registry.activitypub.software/transfem-org/sharkey:2025.4.7@sha256:8857c9ded749bf6d1aa4f0e54095a0472f9d23a3dc39052c135f2b37881615d9
    restart: unless-stopped
    container_name: sharkey
    volumes:
      - /mnt/storage/sharkey/files:/sharkey/files
      - "{{ docker_mounts_directory }}/sharkey/config:/sharkey/.config:ro"
    networks:
      - internal
      - web
      - db
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.sharkey.entryPoints=websecure
      - traefik.http.routers.sharkey.rule=Host(`social.{{ main_domain }}`)
      - traefik.http.routers.sharkey.service=sharkey
      - traefik.http.services.sharkey.loadBalancer.server.port=3000

  sharkey_redis:
    image: redis:8.10.1@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
    restart: unless-stopped
    container_name: sharkey_redis
    networks:
      - internal
    volumes:
      - "{{ docker_mounts_directory }}/sharkey/redis:/data"
    healthcheck:
      test: "redis-cli ping"
      interval: 5s
      retries: 20

  sharkey_deeplx:
    image: ghcr.io/owo-network/deeplx:v1.2.4@sha256:1e34ae3e7f4387078ddcda965e0745898ac6ab08ea51fba65dd2f1eb9ad46938
    restart: unless-stopped
    container_name: sharkey_deeplx
    # port is 1188 by default -> https://deeplx.owo.network/install/variables.html
    networks:
      - internal

