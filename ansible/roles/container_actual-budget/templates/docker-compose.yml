services:
  actual-budget:
    container_name: actual-budget
    image: docker.io/actualbudget/actual-server:26.7.0@sha256:e18b7fbfec6157a368fad4146563f397502e9da70a120aeaeac63b4977405d1c
    environment:
      ACTUAL_OPENID_DISCOVERY_URL: "https://auth.{{ main_domain }}/.well-known/openid-configuration"
      ACTUAL_OPENID_CLIENT_ID: "{{ backbone__authelia__oidc_actual_budget_clientid }}"
      ACTUAL_OPENID_CLIENT_SECRET: "{{ backbone__authelia__oidc_actual_budget_clientsecret }}"
      ACTUAL_OPENID_SERVER_HOSTNAME: "https://actual.{{ main_domain }}"
      ACTUAL_OPENID_ENFORCE: "true"
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.actual.entryPoints=websecure
      - traefik.http.routers.actual.rule=Host(`actual.{{ main_domain }}`)
      - traefik.http.routers.actual.service=actual
      - traefik.http.services.actual.loadBalancer.server.port=5006
    volumes:
      - "{{ docker_mounts_directory }}/actual-budget:/data"
    restart: unless-stopped
networks:
  web:
    external: true
