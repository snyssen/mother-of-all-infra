services:
  rest-server:
    image: restic/rest-server:0.15.0@sha256:5922067eb6f1ed8a632bc56101677ab4968a3b88a28806423e95ebb5eeecdebb
    restart: unless-stopped
    container_name: rest-server
    ports:
      - "8000:8000"
    environment:
      - DISABLE_AUTHENTICATION=true # server will only be accessible on LAN, so I'm not worried about auth # TODO: I should be worried tho
      - OPTIONS=--prometheus
    volumes:
      - /mnt/storage/data:/data
