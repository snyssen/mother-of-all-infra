---
- name: "{{ vm.name }} | Ensure VM directory exists"
  become: true
  ansible.builtin.file:
    path: "{{ libvirt_vmstore_root }}/{{ vm.name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# --- disk_image boot source ---
- name: "{{ vm.name }} | Check if disk image already exists"
  ansible.builtin.stat:
    path: "{{ vm.disk_image.dest }}"
  register: _disk_image_stat
  when: vm.disk_image is defined

- name: "{{ vm.name }} | Determine whether disk_image archive should be extracted"
  ansible.builtin.set_fact:
    _disk_image_extract: >-
      {{
        (vm.disk_image.extract | default(
          vm.disk_image.url | regex_search('\.(xz|gz|bz2|zip|tar(\.(xz|gz|bz2))?)$')
          is not none
        )) | bool
      }}
  when: vm.disk_image is defined

- name: "{{ vm.name }} | Download disk image (no extraction needed)"
  become: true
  ansible.builtin.get_url:
    url: "{{ vm.disk_image.url }}"
    dest: "{{ vm.disk_image.dest }}"
    mode: "0644"
    checksum: "{{ vm.disk_image.checksum | default(omit) }}"
  when:
    - vm.disk_image is defined
    - not _disk_image_extract
    - not _disk_image_stat.stat.exists

- name: "{{ vm.name }} | Download disk image archive"
  become: true
  ansible.builtin.get_url:
    url: "{{ vm.disk_image.url }}"
    dest: "/tmp/{{ vm.disk_image.url | basename }}"
    mode: "0644"
    checksum: "{{ vm.disk_image.checksum | default(omit) }}"
  when:
    - vm.disk_image is defined
    - _disk_image_extract
    - not _disk_image_stat.stat.exists

- name: "{{ vm.name }} | Extract .xz disk image"
  become: true
  ansible.builtin.shell:
    cmd: "xz --decompress --keep --stdout -- '{{ '/tmp/' + (vm.disk_image.url | basename) }}' > '{{ vm.disk_image.dest }}'"
    creates: "{{ vm.disk_image.dest }}"
  when:
    - vm.disk_image is defined
    - _disk_image_extract
    - not _disk_image_stat.stat.exists
    - vm.disk_image.url | regex_search('\.xz$') is not none
    - vm.disk_image.url | regex_search('\.tar\.xz$') is none

- name: "{{ vm.name }} | Extract .gz disk image"
  become: true
  ansible.builtin.shell:
    cmd: "gunzip --keep --stdout -- '{{ '/tmp/' + (vm.disk_image.url | basename) }}' > '{{ vm.disk_image.dest }}'"
    creates: "{{ vm.disk_image.dest }}"
  when:
    - vm.disk_image is defined
    - _disk_image_extract
    - not _disk_image_stat.stat.exists
    - vm.disk_image.url | regex_search('\.gz$') is not none
    - vm.disk_image.url | regex_search('\.tar\.gz$') is none

- name: "{{ vm.name }} | Extract .bz2 disk image"
  become: true
  ansible.builtin.shell:
    cmd: "bunzip2 --keep --stdout -- '{{ '/tmp/' + (vm.disk_image.url | basename) }}' > '{{ vm.disk_image.dest }}'"
    creates: "{{ vm.disk_image.dest }}"
  when:
    - vm.disk_image is defined
    - _disk_image_extract
    - not _disk_image_stat.stat.exists
    - vm.disk_image.url | regex_search('\.bz2$') is not none
    - vm.disk_image.url | regex_search('\.tar\.bz2$') is none

- name: "{{ vm.name }} | Extract .zip / .tar.* disk image archive"
  become: true
  ansible.builtin.unarchive:
    src: "/tmp/{{ vm.disk_image.url | basename }}"
    dest: "{{ vm.disk_image.dest | dirname }}"
    remote_src: true
    creates: "{{ vm.disk_image.dest }}"
  when:
    - vm.disk_image is defined
    - _disk_image_extract
    - not _disk_image_stat.stat.exists
    - vm.disk_image.url | regex_search('\.(zip|tar(\.(xz|gz|bz2))?)$') is not none

# --- Resize disk image if disk_gb is set and larger than current size ---
- name: "{{ vm.name }} | Get current disk image virtual size"
  become: true
  ansible.builtin.command:
    argv:
      - qemu-img
      - info
      - --output=json
      - "{{ vm.disk_image.dest }}"
  register: _disk_image_info
  changed_when: false
  when:
    - vm.disk_image is defined
    - vm.disk_gb is defined

- name: "{{ vm.name }} | Resize disk image if target size is larger than current"
  become: true
  ansible.builtin.command:
    argv:
      - qemu-img
      - resize
      - "{{ vm.disk_image.dest }}"
      - "{{ vm.disk_gb }}G"
  when:
    - vm.disk_image is defined
    - vm.disk_gb is defined
    - _disk_image_info is defined
    - (_disk_image_info.stdout | from_json)['virtual-size'] < (vm.disk_gb | int * 1024 * 1024 * 1024)
  changed_when: true

# --- iso_image boot source ---
- name: "{{ vm.name }} | Download ISO image"
  become: true
  ansible.builtin.get_url:
    url: "{{ vm.iso_image.url }}"
    dest: "{{ vm.iso_image.dest }}"
    mode: "0644"
    checksum: "{{ vm.iso_image.checksum | default(omit) }}"
    force: false
  when: vm.iso_image is defined

- name: "{{ vm.name }} | Create base qcow2 disk for ISO-based VM"
  become: true
  ansible.builtin.command:
    argv:
      - qemu-img
      - create
      - -f
      - qcow2
      - "{{ libvirt_vmstore_root }}/{{ vm.name }}/{{ vm.name }}.qcow2"
      - "{{ vm.disk_gb | default(20) }}G"
    creates: "{{ libvirt_vmstore_root }}/{{ vm.name }}/{{ vm.name }}.qcow2"
  when: vm.iso_image is defined
  changed_when: true

# --- Render and apply domain XML ---
- name: "{{ vm.name }} | Render domain XML from template"
  become: true
  ansible.builtin.template:
    src: "{{ 'domain-disk-image.xml.j2' if vm.disk_image is defined else 'domain-iso.xml.j2' }}"
    dest: "{{ libvirt_vmstore_root }}/{{ vm.name }}/domain.xml"
    owner: root
    group: root
    mode: "0644"
  register: _domain_xml

- name: "{{ vm.name }} | Define libvirt domain from XML"
  become: true
  ansible.builtin.command:
    argv:
      - virsh
      - --connect
      - "{{ libvirt_uri }}"
      - define
      - "{{ libvirt_vmstore_root }}/{{ vm.name }}/domain.xml"
  when: _domain_xml.changed
  changed_when: true

- name: "{{ vm.name }} | Set domain to autostart"
  become: true
  ansible.builtin.command:
    argv:
      - virsh
      - --connect
      - "{{ libvirt_uri }}"
      - autostart
      - "{{ vm.name }}"
  register: _autostart_result
  changed_when: "'Domain ' + vm.name + ' marked as autostarted' in _autostart_result.stdout"

- name: "{{ vm.name }} | Start domain if not running"
  become: true
  ansible.builtin.command:
    argv:
      - virsh
      - --connect
      - "{{ libvirt_uri }}"
      - start
      - "{{ vm.name }}"
  register: _start_result
  changed_when: "'Domain ' + vm.name + ' started' in _start_result.stdout"
  failed_when:
    - _start_result.rc != 0
    - "'already active' not in _start_result.stderr"
