---
- name: "{{ vm.name }} | Remove VM (state: absent)"
  ansible.builtin.include_tasks: absent.yml
  when: (vm.state | default('present')) == 'absent'

- name: "{{ vm.name }} | Provision VM (state: present)"
  when: (vm.state | default('present')) == 'present'
  block:
    - name: "{{ vm.name }} | Validate exactly one boot source is defined"
      ansible.builtin.assert:
        that:
          - (vm.disk_image is defined) != (vm.iso_image is defined)
        fail_msg: >-
          VM '{{ vm.name }}' must define exactly one boot source (disk_image or iso_image),
          but found: disk_image={{ vm.disk_image is defined }}, iso_image={{ vm.iso_image is defined }}.

    - name: "{{ vm.name }} | Ensure VM directory exists"
      become: true
      ansible.builtin.file:
        path: "{{ libvirt_vmstore_root }}/{{ vm.name }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "{{ vm.name }} | Set up virtiofs LUKS key"
      when: (vm.virtiofs_luks_key | default({})).enable | default(false)
      block:
        - name: "{{ vm.name }} | Ensure LUKS keys directory exists"
          become: true
          ansible.builtin.file:
            path: "{{ libvirt_vm_keys_root }}/{{ vm.name }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: "{{ vm.name }} | Generate LUKS key (idempotent)"
          become: true
          ansible.builtin.command:
            cmd: "dd if=/dev/urandom bs=2048 count=1 of={{ libvirt_vm_keys_root }}/{{ vm.name }}/luks.key"
            creates: "{{ libvirt_vm_keys_root }}/{{ vm.name }}/luks.key"

        - name: "{{ vm.name }} | Restrict LUKS key file permissions"
          become: true
          ansible.builtin.file:
            path: "{{ libvirt_vm_keys_root }}/{{ vm.name }}/luks.key"
            owner: root
            group: root
            mode: "0400"

    - name: "{{ vm.name }} | Provision disk image boot source"
      ansible.builtin.include_tasks: disk-image.yml
      when: vm.disk_image is defined

    - name: "{{ vm.name }} | Provision ISO image boot source"
      ansible.builtin.include_tasks: iso-image.yml
      when: vm.iso_image is defined

    - name: "{{ vm.name }} | Render domain XML from template"
      become: true
      ansible.builtin.template:
        src: "{{ 'domain-disk-image.xml.j2' if vm.disk_image is defined else 'domain-iso.xml.j2' }}"
        dest: "{{ libvirt_vmstore_root }}/{{ vm.name }}/domain.xml"
        owner: root
        group: root
        mode: "0644"
      register: _domain_xml

    - name: "{{ vm.name }} | Check if libvirt domain exists"
      become: true
      ansible.builtin.command:
        argv:
          - virsh
          - --connect
          - "{{ libvirt_uri }}"
          - dominfo
          - "{{ vm.name }}"
      register: _domain_info
      changed_when: false
      failed_when: false

    - name: "{{ vm.name }} | Gracefully shut down domain if XML changed (to apply updates)"
      become: true
      ansible.builtin.command:
        argv:
          - virsh
          - --connect
          - "{{ libvirt_uri }}"
          - shutdown
          - "{{ vm.name }}"
      when: _domain_xml.changed and _domain_info.rc == 0
      changed_when: true
      register: _shutdown_result
      failed_when: false

    - name: "{{ vm.name }} | Wait for domain to shut down (max 3min)"
      become: true
      ansible.builtin.command:
        argv:
          - virsh
          - --connect
          - "{{ libvirt_uri }}"
          - domstate
          - "{{ vm.name }}"
      register: _domain_state
      until: "'shut off' in _domain_state.stdout or 'crashed' in _domain_state.stdout"
      # 36 x 5s = 180s = 3min max wait time for graceful shutdown before force stop
      retries: 36
      delay: 5
      changed_when: false
      failed_when: false
      when: _domain_xml.changed and _domain_info.rc == 0

    - name: "{{ vm.name }} | Force stop domain if shutdown timeout exceeded"
      become: true
      ansible.builtin.command:
        argv:
          - virsh
          - --connect
          - "{{ libvirt_uri }}"
          - destroy
          - "{{ vm.name }}"
      when:
        - _domain_xml.changed and _domain_info.rc == 0
        - _domain_state is defined
        - "'shut off' not in _domain_state.stdout"
      changed_when: true

    - name: "{{ vm.name }} | Undefine domain to apply updates"
      become: true
      ansible.builtin.command:
        argv:
          - virsh
          - --connect
          - "{{ libvirt_uri }}"
          - undefine
          - --nvram
          - "{{ vm.name }}"
      when: _domain_xml.changed and _domain_info.rc == 0
      changed_when: true

    - name: "{{ vm.name }} | Define libvirt domain from XML"
      become: true
      ansible.builtin.command:
        argv:
          - virsh
          - --connect
          - "{{ libvirt_uri }}"
          - define
          - "{{ libvirt_vmstore_root }}/{{ vm.name }}/domain.xml"
      when: _domain_xml.changed or _domain_info.rc != 0
      changed_when: true

    - name: "{{ vm.name }} | Set domain to autostart"
      become: true
      ansible.builtin.command:
        argv:
          - virsh
          - --connect
          - "{{ libvirt_uri }}"
          - autostart
          - "{{ vm.name }}"
      register: _autostart_result
      changed_when: "'Domain ' + vm.name + ' marked as autostarted' in _autostart_result.stdout"

    - name: "{{ vm.name }} | Start domain if not running"
      become: true
      ansible.builtin.command:
        argv:
          - virsh
          - --connect
          - "{{ libvirt_uri }}"
          - start
          - "{{ vm.name }}"
      register: _start_result
      changed_when: "'Domain ' + vm.name + ' started' in _start_result.stdout"
      failed_when:
        - _start_result.rc != 0
        - "'already active' not in _start_result.stderr"
