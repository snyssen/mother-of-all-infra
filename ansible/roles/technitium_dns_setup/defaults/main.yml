---
# Role of this Technitium node: 'primary', 'secondary', or 'standalone'
technitium_dns_setup_cluster_role: standalone

# Fully-qualified cluster domain name.
# Required when technitium_dns_setup_cluster_role is 'primary'.
technitium_dns_setup_cluster_domain: ""

# IP address of the primary node reachable by secondaries.
# Required for both technitium_dns_setup_cluster_role 'primary' and 'secondary'.
technitium_dns_setup_cluster_primary_ip_address: ""

# HTTPS URL of the primary node.
# Required when technitium_dns_setup_cluster_role is 'secondary'.
technitium_dns_setup_cluster_primary_url: ""

# IP address of this secondary node reachable by the primary.
# Required when technitium_dns_setup_cluster_role is 'secondary'.
technitium_dns_setup_cluster_secondary_ip_address: ""

# Force an immediate configuration resync on secondaries.
# Useful when a node has already joined but appears stale.
technitium_dns_setup_trigger_secondary_resync: false

# Configure a managed HTTPS certificate on the primary node.
# When enabled, the role configures Technitium to use the PKCS#12 certificate
# at technitium_dns_setup_tls_certificate_path.
technitium_dns_setup_tls_enable_managed_certificate: false
technitium_dns_setup_tls_certificate_path: ""
technitium_dns_setup_tls_certificate_password: ""
technitium_dns_setup_tls_port: 53443

# DNS zones to ensure exist on the primary instance.
# Replicated to secondaries via Technitium clustering.
technitium_dns_setup_zones: []

# Split-horizon APP records to manage on the primary instance.
# Replicated to secondaries via Technitium clustering.
# See group_vars/technitium/vars.yml for the expected data structure.
technitium_dns_setup_split_records: []
