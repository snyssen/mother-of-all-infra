---
# Create DNS zones and split-horizon APP records on the primary instance.
# These are driven by the `technitium_dns_setup_zones` and `technitium_dns_setup_split_records`
# variables defined in group_vars/technitium/vars.yml (or host_vars overrides).
#
# Zones and records are automatically replicated to secondary nodes via
# Technitium's built-in clustering — no action is needed on the secondary.

- name: Ensure DNS zones are present
  effectivelywild.technitium_dns.technitium_dns_zone:
    api_url: "http://{{ technitium_dns_setup_api_host }}"
    api_port: "{{ technitium_dns_setup_api_port }}"
    api_token: "{{ technitium_dns_setup_session_token }}"
    zone: "{{ item }}"
    type: Primary
    state: present
  loop: "{{ technitium_dns_setup_zones }}"

- name: Ensure primary zones are members of cluster catalog
  effectivelywild.technitium_dns.technitium_dns_set_zone_options:
    api_url: "http://{{ technitium_dns_setup_api_host }}"
    api_port: "{{ technitium_dns_setup_api_port }}"
    api_token: "{{ technitium_dns_setup_session_token }}"
    zone: "{{ item }}"
    catalog: "cluster-catalog.{{ technitium_dns_setup_cluster_domain }}"
  loop: "{{ technitium_dns_setup_zones }}"
  when:
    - technitium_dns_setup_cluster_role == 'primary'
    - technitium_dns_setup_cluster_domain | length > 0

- name: Build final store app installation list
  ansible.builtin.set_fact:
    technitium_dns_setup_store_apps_final: >-
      {{
        (
          technitium_dns_setup_store_apps
          + (
              ['Split Horizon']
              if (technitium_dns_setup_split_records | length > 0)
              else []
            )
        )
        | unique
      }}

- name: Query available apps from the DNS App Store
  effectivelywild.technitium_dns.technitium_dns_list_store_apps:
    api_url: "http://{{ technitium_dns_setup_api_host }}"
    api_port: "{{ technitium_dns_setup_api_port }}"
    api_token: "{{ technitium_dns_setup_session_token }}"
  register: technitium_dns_setup_store_apps_available
  when: technitium_dns_setup_store_apps_final | length > 0

- name: Ensure desired DNS apps are installed
  ansible.builtin.include_tasks: _install_store_app.yml
  loop: "{{ technitium_dns_setup_store_apps_final }}"
  loop_control:
    loop_var: technitium_dns_setup_store_app_name
  vars:
    technitium_dns_setup_store_apps_data: "{{ technitium_dns_setup_store_apps_available.store_apps | default([]) }}"
  when: technitium_dns_setup_store_apps_final | length > 0

- name: Configure split-horizon APP records
  ansible.builtin.include_tasks: _split_record.yml
  loop: "{{ technitium_dns_setup_split_records }}"
  loop_control:
    loop_var: technitium_dns_setup_split_record
    label: "{{ technitium_dns_setup_split_record.zone }}/{{ technitium_dns_setup_split_record.name }}"
