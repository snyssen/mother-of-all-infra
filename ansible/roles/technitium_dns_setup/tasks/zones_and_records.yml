---
# Create DNS zones and split-horizon APP records on the primary instance.
# These are driven by the `technitium_dns_zones` and `technitium_dns_split_records`
# variables defined in group_vars/technitium/vars.yml (or host_vars overrides).
#
# Zones and records are automatically replicated to secondary nodes via
# Technitium's built-in clustering — no action is needed on the secondary.
#
# The SplitHorizon app must be installed on the instance before split-horizon
# records can be created (Apps → Get Apps from Store → SplitHorizon).

- name: Ensure DNS zones are present
  effectivelywild.technitium_dns.zone:
    hostname: "{{ technitium_api_host }}"
    api_key: "{{ technitium_session_token }}"
    zone: "{{ item }}"
    state: present
  loop: "{{ technitium_dns_zones }}"

- name: Configure split-horizon APP records
  ansible.builtin.include_tasks: _split_record.yml
  loop: "{{ technitium_dns_split_records }}"
  loop_control:
    loop_var: technitium_split_record
    label: "{{ technitium_split_record.zone }}/{{ technitium_split_record.name }}"
