---
- name: Validate block list URLs format
  ansible.builtin.assert:
    that:
      - item is match('^https?://')
    fail_msg: "Invalid block list URL '{{ item }}'. URLs must start with http:// or https://"
  loop: "{{ technitium_dns_setup_block_list_urls }}"

- name: Configure global block list URLs and refresh interval
  effectivelywild.technitium_dns.technitium_dns_set_server_settings:
    api_url: "http://{{ technitium_dns_setup_api_host }}"
    api_port: "{{ technitium_dns_setup_api_port }}"
    api_token: "{{ technitium_dns_setup_session_token }}"
    enableBlocking: true
    blockListUrls: "{{ technitium_dns_setup_block_list_urls }}"
    blockListUpdateIntervalHours: "{{ technitium_dns_setup_block_list_update_interval_hours }}"
