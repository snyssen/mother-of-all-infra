---
# Join an existing Technitium cluster as a secondary node.
#
# Joining overwrites Apps, Settings, Allowed/Blocked lists, and Administration
# config on this instance with the primary's config — zone data is synced
# automatically afterwards.
#
# Required variables (set in host_vars/technitium-secondary/vars.yml):
#   technitium_dns_setup_cluster_primary_url            — HTTPS URL of the primary (port 53443)
#   technitium_dns_setup_cluster_secondary_ip_addresses — list of this node's IPs reachable by the primary
#   technitium_dns_setup_admin_password                 — admin password of the *primary* node
#                                                        (same vault value used for initial setup)
# Optional:
#   technitium_dns_setup_cluster_primary_ip_address     — primary IP for when DNS is not yet available

- name: Check current cluster status on secondary
  ansible.builtin.uri:
    url: "http://{{ technitium_dns_setup_api_host }}:{{ technitium_dns_setup_api_port }}/api/admin/cluster/state"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ technitium_dns_setup_session_token }}"
    status_code: [200]
    return_content: true
  register: _secondary_cluster_status
  no_log: true
  failed_when: _secondary_cluster_status.json.status != 'ok'

- name: Join cluster as secondary node
  ansible.builtin.uri:
    url: "http://{{ technitium_dns_setup_api_host }}:{{ technitium_dns_setup_api_port }}/api/admin/cluster/initJoin"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ technitium_dns_setup_session_token }}"
      secondaryNodeIpAddress: "{{ technitium_dns_setup_cluster_secondary_ip_address }}"
      primaryNodeUrl: "{{ technitium_dns_setup_cluster_primary_url }}"
      primaryNodeIpAddress: "{{ technitium_dns_setup_cluster_primary_ip_address | default('') }}"
      # Self-signed TLS certificate is used by default after cluster init on primary
      ignoreCertificateErrors: "true"
      primaryNodeUsername: admin
      primaryNodePassword: "{{ technitium_dns_setup_admin_password }}"
    status_code: [200]
    return_content: true
    # The initJoin call synchronizes the full config from the primary; extend the timeout accordingly.
    timeout: 300
  register: _cluster_join
  no_log: true
  failed_when: _cluster_join.json.status != 'ok'
  when: not _secondary_cluster_status.json.response.clusterInitialized

- name: Wait for initial config sync to settle
  ansible.builtin.pause:
    seconds: 30
    prompt: "Waiting 30 s for the Technitium cluster secondary to finish syncing config from primary…"
  when:
    - not _secondary_cluster_status.json.response.clusterInitialized
    - _cluster_join.json.status == 'ok'

- name: Report cluster join result
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} has joined the Technitium cluster as a secondary node.
      Configuration and zone data will be synced from the primary automatically.
  when: not _secondary_cluster_status.json.response.clusterInitialized

- name: Report already joined
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} is already a member of a Technitium cluster — skipping join."
  when: _secondary_cluster_status.json.response.clusterInitialized

- name: Trigger immediate cluster resync on secondary (optional)
  effectivelywild.technitium_dns.technitium_dns_resync_cluster:
    api_url: "http://{{ technitium_dns_setup_api_host }}"
    api_port: "{{ technitium_dns_setup_api_port }}"
    api_token: "{{ technitium_dns_setup_session_token }}"
  when:
    - technitium_dns_setup_trigger_secondary_resync | bool
    - _secondary_cluster_status.json.response.clusterInitialized or (_cluster_join is defined and _cluster_join.json.status == 'ok')
