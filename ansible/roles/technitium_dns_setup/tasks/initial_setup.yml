---
# Automate Technitium DNS Server initial setup.
#
# Technitium ships with default credentials (admin / admin).  This task file:
#   1. Probes the instance: tries to log in with the vault-managed admin password.
#   2. If the probe fails, the instance is still on the default credentials:
#      it logs in with admin/admin, changes the password, then logs in again.
#   3. Stores the resulting session token as the `technitium_session_token` fact,
#      which is used by all subsequent tasks in this role.
#
# All calls that carry credentials use POST with no_log: true to avoid leaking
# secrets into Ansible output or server access logs.
#
# NOTE: Technitium always returns HTTP 200; errors are indicated by
#       `response.json.status == "error"` in the body.

- name: Probe — try login with vault admin password
  ansible.builtin.uri:
    url: "{{ technitium_api_host }}/api/user/login"
    method: POST
    body_format: form-urlencoded
    body:
      user: admin
      pass: "{{ technitium_admin_password }}"
      includeInfo: "false"
    status_code: [200]
    return_content: true
  register: _probe_login
  no_log: true
  failed_when: false

- name: First-time setup — change default admin password
  when: _probe_login.json.status == 'error'
  block:
    - name: Login with default admin/admin credentials
      ansible.builtin.uri:
        url: "{{ technitium_api_host }}/api/user/login"
        method: POST
        body_format: form-urlencoded
        body:
          user: admin
          pass: admin
          includeInfo: "false"
        status_code: [200]
        return_content: true
      register: _default_login
      no_log: true
      failed_when: _default_login.json.status != 'ok'

    - name: Change admin password to vault-managed value
      ansible.builtin.uri:
        url: "{{ technitium_api_host }}/api/user/changePassword"
        method: POST
        body_format: form-urlencoded
        body:
          token: "{{ _default_login.json.response.token }}"
          pass: admin
          newPass: "{{ technitium_admin_password }}"
        status_code: [200]
        return_content: true
      register: _change_pass
      no_log: true
      failed_when: _change_pass.json.status != 'ok'

- name: Login to obtain session token for this play
  ansible.builtin.uri:
    url: "{{ technitium_api_host }}/api/user/login"
    method: POST
    body_format: form-urlencoded
    body:
      user: admin
      pass: "{{ technitium_admin_password }}"
      includeInfo: "false"
    status_code: [200]
    return_content: true
  register: _session_login
  no_log: true
  failed_when: _session_login.json.status != 'ok'

- name: Store session token as fact
  ansible.builtin.set_fact:
    technitium_session_token: "{{ _session_login.json.response.token }}"
