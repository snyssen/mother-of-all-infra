services:
  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
    container_name: crowdsec
    restart: unless-stopped
    networks:
      - monitoring
      - web
    volumes:
      - "{{ docker_mounts_directory }}/crowdsec/crowdsec:/etc/crowdsec"
      - "{{ docker_mounts_directory }}/crowdsec/data:/var/lib/crowdsec/data"
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.crowdsec.entryPoints=websecure
      - traefik.http.routers.crowdsec.rule=Host(`crowdsec.{{ main_domain }}`)
      - traefik.http.routers.crowdsec.middlewares=lan-whitelist
      - traefik.http.routers.crowdsec.service=crowdsec
      - traefik.http.services.crowdsec.loadBalancer.server.port=8080
    environment:
      BOUNCER_KEY_firewall: "{{ crowdsec__firewall_bouncer__api_key }}"
      COLLECTIONS: "LePresidente/authelia crowdsecurity/traefik"

  crowdsec-web-ui:
    image: ghcr.io/theduffman85/crowdsec-web-ui:2026.10.6@sha256:58d8c344c9375f268cbf88a55f5f7f1e4fdd3e0a0a9e2e56ec91ad8b4bcccf31
    container_name: crowdsec-web-ui
    restart: unless-stopped
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.crowdsec-web-ui.entryPoints=websecure
      - traefik.http.routers.crowdsec-web-ui.rule=Host(`crowdsec-ui.{{ main_domain }}`)
      - traefik.http.routers.crowdsec-web-ui.middlewares=authelia@docker
      - traefik.http.routers.crowdsec-web-ui.service=crowdsec-web-ui
      - traefik.http.services.crowdsec-web-ui.loadBalancer.server.port=3000
    volumes:
      - "{{ docker_mounts_directory }}/crowdsec-web-ui/data:/app/data"
    environment:
      - CROWDSEC_PASSWORD={{ crowdsec__webui_password }}
networks:
  monitoring:
    external: true
  web:
    external: true
