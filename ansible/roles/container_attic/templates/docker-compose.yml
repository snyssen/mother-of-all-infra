services:
  attic:
    image: ghcr.io/zhaofengli/attic:latest
    container_name: attic
    restart: unless-stopped
    networks:
      - web
      - db
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.attic.entryPoints=websecure
      - traefik.http.routers.attic.rule=Host(`attic.{{ main_domain }}`)
      - traefik.http.routers.attic.service=attic
      - traefik.http.services.attic.loadBalancer.server.port=8080
    environment:
      - ATTIC_LOG=info
    volumes:
      - "/mnt/storage/attic/attic.toml:/attic/attic.toml:ro"
      - "/mnt/storage/attic/storage:/attic/storage"
    command: [ "-f", "/attic/attic.toml" ]

networks:
  web:
    external: true
  db:
    external: true
