services:
  prometheus:
    image: quay.io/prometheus/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    container_name: prometheus
    restart: unless-stopped
    networks:
      - monitoring
      - web
    command: >-
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.path=/prometheus
      --web.console.libraries=/usr/share/prometheus/console_libraries
      --web.console.templates=/usr/share/prometheus/consoles
      --storage.tsdb.retention.time=1y
    volumes:
      - /mnt/storage/prometheus:/etc/prometheus
      - "{{ docker_mounts_directory }}/monitoring/prometheus:/prometheus"
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.prometheus.entryPoints=websecure
      - traefik.http.routers.prometheus.rule=Host(`prometheus.{{ main_domain }}`)
      - traefik.http.routers.prometheus.middlewares=authelia@docker
    mem_limit: 2g

  grafana:
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    container_name: grafana
    restart: unless-stopped
    networks:
      - monitoring
      - web
    volumes:
      - "{{ docker_mounts_directory }}/grafana/data:/var/lib/grafana"
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.grafana.entryPoints=websecure
      - traefik.http.routers.grafana.rule=Host(`monitor.{{ main_domain }}`)
    environment:
      - GF_INSTALL_PLUGINS=volkovlabs-rss-datasource
      - GF_SERVER_ROOT_URL=https://monitor.{{ main_domain }}
      - GF_ANALYTICS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # SMTP
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST={{ smtp__host }}:{{ smtp__port }}
      - GF_SMTP_USER={{ smtp__user }}
      - GF_SMTP_PASSWORD={{ smtp__pass | replace('$', '$$') }}
      - GF_SMTP_FROM_ADDRESS=grafana@{{ main_domain }}
      # OIDC
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Authelia
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID={{ backbone__authelia__oidc_grafana_clientid }}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET={{ backbone__authelia__oidc_grafana_clientsecret }}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email groups
      - GF_AUTH_GENERIC_OAUTH_EMPTY_SCOPES=false
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://auth.{{ main_domain }}/api/oidc/authorization
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://auth.{{ main_domain }}/api/oidc/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://auth.{{ main_domain }}/api/oidc/userinfo
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
      - GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH=groups
      - GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH=name
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups, 'sysadmin') && 'GrafanaAdmin' || contains(groups, 'sysviewer') && 'Viewer'
      - GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN=true
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT=true
    mem_limit: 256m

  grafana-to-ntfy:
    container_name: grafana-to-ntfy
    image: kittyandrew/grafana-to-ntfy@sha256:e1386f61db297b37ba4a6a056dfc370e9bee16c0cf394a24b581bdf0cd859a3e
    restart: unless-stopped
    environment:
      - NTFY_URL=https://ntfy.{{ main_domain }}/{{ ntfy__topics__monitoring }}
      - NTFY_BAUTH_USER=monitoring
      - NTFY_BAUTH_PASS={{ vault_ntfy__users__monitoring_password | replace('$', '$$') }}
      - BAUTH_USER=monitoring
      - BAUTH_PASS={{ vault_ntfy__users__monitoring_password | replace('$', '$$') }}
      - MARKDOWN=true               # optional, boolean (enable Markdown formatting)
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.7.4@sha256:87f0a067673756a3cede1bcbf0c74875f7df9b09fddb53e399d0c576f756cfcc
    container_name: loki
    restart: unless-stopped
    volumes:
      - "{{ docker_mounts_directory }}/monitoring/loki:/loki"
    command: -config.file=/loki/loki-config.yaml
    networks:
      - monitoring
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.loki.entryPoints=websecure
      - traefik.http.routers.loki.rule=Host(`loki.{{ main_domain }}`)
      - traefik.http.routers.loki.middlewares=lan-whitelist
      - traefik.http.routers.loki.service=loki
      - traefik.http.services.loki.loadBalancer.server.port=3100
    mem_limit: 2g

  uptime:
    image: louislam/uptime-kuma:1@sha256:3d632903e6af34139a37f18055c4f1bfd9b7205ae1138f1e5e8940ddc1d176f9
    container_name: uptime
    restart: unless-stopped
    networks:
      - monitoring
      - web
    # Expose port directly on host so ansible can manage instance
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - "{{ docker_mounts_directory }}/uptime:/app/data"
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      # API traffic
      - traefik.http.routers.uptime-api.entryPoints=websecure
      - traefik.http.routers.uptime-api.rule=Host(`uptime.{{ main_domain }}`) && PathPrefix(`/api`)
      - traefik.http.routers.uptime-api.middlewares=lan-whitelist
      # Web traffic
      - traefik.http.routers.uptime-web.entryPoints=websecure
      - traefik.http.routers.uptime-web.rule=Host(`uptime.{{ main_domain }}`)
      - traefik.http.routers.uptime-web.middlewares=authelia@docker

  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.13.2@sha256:611cacc80f53fe289f7e7bfe301032a117fb57e790c37272ee05f3b0eba690a3
    container_name: umami
    networks:
      - web
      - db
    environment:
      DATABASE_URL: postgresql://umami:{{ monitoring__umami_db_pass }}@postgres:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: "{{ monitoring__umami_app_secret }}"
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.umami.entryPoints=websecure
      - traefik.http.routers.umami.rule=Host(`umami.{{ main_domain }}`)
      - traefik.http.routers.umami.service=umami
      - traefik.http.services.umami.loadBalancer.server.port=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  monitoring:
    external: true
  web:
    external: true
  db:
    external: true
