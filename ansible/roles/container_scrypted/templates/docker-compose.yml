services:
  scrypted:
    container_name: scrypted
    image: ghcr.io/koush/scrypted
    network_mode: host
    environment:
      # Expose the NFS-backed bulk storage to the NVR plugin for recordings
      - SCRYPTED_NVR_VOLUME=/nvr
      # Allow watchtower to trigger in-place updates via webhook
      - SCRYPTED_WEBHOOK_UPDATE_AUTHORIZATION=Bearer {{ scrypted__watchtower_token }}
      - SCRYPTED_WEBHOOK_UPDATE=http://localhost:10444/v1/update
    volumes:
      - "{{ docker_mounts_directory }}/scrypted:/server/volume"
      # /mnt/bulk is an NFS share configured in NixOS (nix/hosts/scrypted/configuration.nix)
      - /mnt/bulk:/nvr
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    # Scrypted keeps per-device in-memory logs; disable file logging to reduce
    # wear on the system drive. Re-enable json-file driver if deep debugging is needed.
    logging:
      driver: "none"
    labels:
      - "com.centurylinklabs.watchtower.scope=scrypted"
    # Use public resolvers to avoid issues with local DNS servers blocking
    # npm registry and other Scrypted plugin sources (per upstream recommendation)
    dns: "{{ scrypted__dns_servers | default(['1.1.1.1', '8.8.8.8']) }}"

  # watchtower handles automated image updates for the Scrypted stack.
  # See https://docs.scrypted.app/install/linux-docker.html
  watchtower:
    container_name: scrypted-watchtower
    image: nickfedor/watchtower
    environment:
      - WATCHTOWER_HTTP_API_TOKEN={{ scrypted__watchtower_token }}
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_SCOPE=scrypted
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "10444:8080"
    restart: unless-stopped
    command: --interval 3600 --cleanup --scope scrypted
    labels:
      - "com.centurylinklabs.watchtower.scope=scrypted"
    dns: "{{ scrypted__dns_servers | default(['1.1.1.1', '8.8.8.8']) }}"
