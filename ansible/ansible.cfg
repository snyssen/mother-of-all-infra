[defaults]
inventory = hosts/prod.yml
roles_path = roles
timeout = 30
# Secrets live next to the plain vars as `*.sops.yaml` files, decrypted at inventory load
# with the operator's own age key (recipients per host in /.sops.yaml). host_group_vars
# also reads those files raw; community.sops runs after it, so the decrypted values win.
vars_plugins_enabled = host_group_vars,community.sops.sops
