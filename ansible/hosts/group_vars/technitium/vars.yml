# Split-horizon APP records using Technitium's SplitHorizon plugin.
# The SplitHorizon app must be installed on the primary instance first
# (Apps → Get Apps from Store → SplitHorizon).
#
# Each entry maps a zone+name to a list of network→IP rules:
#   - network: CIDR range to match the client source address
#     ip:      IP address to return for clients in that range
#
# Rules are evaluated in order; the first matching network wins.
# A catch-all "0.0.0.0/0" entry is used as the fallback (public IP).
technitium_dns_split_records:
