---
# Desired DNS zones to create on the primary instance.
# These are replicated to the secondary via Technitium's built-in clustering.
# Add your zone names here; they will be created if they do not exist.
technitium_dns_setup_zones:
  - snyssen.be
  - bigdouf.team

# Additional DNS App Store apps to install on Technitium.
# Split Horizon is installed automatically when split records are defined.
technitium_dns_setup_store_apps:
  - Query Logs (Sqlite)
  - Log Exporter

# Global block list sources for ad blocking.
# Keep empty to skip block list configuration.
technitium_dns_setup_block_list_urls:
  - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
  - https://big.oisd.nl/

# DHCP scope management (optional).
# Uncomment and adapt when preparing DHCP migration/cutover.
technitium_dns_setup_dhcp_scopes:
  - name: Default
    enabled: true
    startingAddress: 192.168.1.1
    endingAddress: 192.168.1.254
    exclusions:
      - startingAddress: 192.168.1.1
        endingAddress: 192.168.1.20
    subnetMask: 255.255.255.0
    leaseTimeHours: 24
    pingCheckEnabled: false
    domainName: lan
    routerAddress: 192.168.1.1
    reservedLeases:
      - hardwareAddress: "70:c9:32:b1:f0:d6"
        address: "192.168.1.114"
        comments: "Dreame Vacuum (Saori)"

# Split-horizon APP records using Technitium's SplitHorizon plugin.
# The SplitHorizon app is installed automatically when this list is non-empty.
#
# Each entry maps a zone+name to a list of network→IP rules:
#   - network: CIDR range to match the client source address
#     ip:      IP address to return for clients in that range
#
# Rules are evaluated in order; the first matching network wins.
# A catch-all "0.0.0.0/0" entry can be used as the fallback (public IP).
technitium_dns_setup_split_records:
  # ---------------------------------------------------------------- #
  # SNYSSEN.BE ZONE                                                  #
  # ---------------------------------------------------------------- #
  - zone: snyssen.be
    name: "@"
    entries:
      - network: "192.168.1.0/24"
        ip: "192.168.1.10"
      - network: "100.64.0.0/10"
        ip: "100.114.242.89"
  - zone: snyssen.be
    name: "*"
    entries:
      - network: "192.168.1.0/24"
        ip: "192.168.1.10"
      - network: "100.64.0.0/10"
        ip: "100.114.242.89"

  - zone: snyssen.be
    name: "backup"
    entries:
      - network: "192.168.1.0/24"
        ip: "192.168.1.11"
      - network: "100.64.0.0/10"
        ip: "100.74.131.24"

  - zone: snyssen.be
    name: "hass"
    entries:
      - network: "192.168.1.0/24"
        ip: "192.168.1.12"
      - network: "100.64.0.0/10"
        ip: "100.75.154.6"
  - zone: snyssen.be
    name: "*.hass"
    entries:
      - network: "192.168.1.0/24"
        ip: "192.168.1.12"
      - network: "100.64.0.0/10"
        ip: "100.75.154.6"

  - zone: snyssen.be
    name: "ingress"
    entries:
      - network: "192.168.1.0/24"
        ip: "46.226.104.72"
      - network: "100.64.0.0/10"
        ip: "100.120.249.84"
  - zone: snyssen.be
    name: "pne.ingress"
    entries:
      - network: "192.168.1.0/24"
        ip: "100.120.249.84" # workaround: forces going through Tailscale
      - network: "100.64.0.0/10"
        ip: "100.120.249.84"
  - zone: snyssen.be
    name: "*.ingress"
    entries:
      - network: "192.168.1.0/24"
        ip: "46.226.104.72"
      - network: "100.64.0.0/10"
        ip: "100.120.249.84"
  # ---------------------------------------------------------------- #
  # BIGDOUF.TEAM ZONE                                                #
  # ---------------------------------------------------------------- #
  - zone: bigdouf.team
    name: "@"
    entries:
      - network: "192.168.1.0/24"
        ip: "192.168.1.10"
      - network: "100.64.0.0/10"
        ip: "100.114.242.89"
  - zone: bigdouf.team
    name: "*"
    entries:
      - network: "192.168.1.0/24"
        ip: "192.168.1.10"
      - network: "100.64.0.0/10"
        ip: "100.114.242.89"
