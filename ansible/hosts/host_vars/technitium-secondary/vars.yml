ansible_user: "{{ vault_ansible_user }}"
ansible_become_pass: "{{ vault_ansible_become_pass }}"

# Technitium DNS Server API configuration for the secondary instance.
# The API key is set during initial Technitium setup via the web UI (port 5380),
# then stored in the Ansible vault as vault_technitium_secondary_api_key.
technitium_api_host: "http://technitium-secondary:5380"
technitium_api_key: "{{ vault_technitium_secondary_api_key }}"
