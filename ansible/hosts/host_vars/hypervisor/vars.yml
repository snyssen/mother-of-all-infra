ansible_user: "{{ vault_ansible_user }}"
ansible_become_pass: "{{ vault_ansible_become_pass }}"

# VM definitions managed by the libvirt-provision playbook.
# To add a new VM, append an entry to libvirt_vms and re-run the playbook.
libvirt_vms:
  # Home Assistant OS appliance (qcow2 image)
  - name: haos
    vcpu: 2
    ram_mb: 2048
    mac_address: "52:54:00:12:34:56" # always start with "52:54:00" for QEMU/KVM; last 3 octets can be random but must be unique per VM
    disk_gb: 64 # only resizes up; leave unset to skip resize
    disk_image:
      url: "https://github.com/home-assistant/operating-system/releases/download/17.1/haos_ova-17.1.qcow2.xz"
      dest: "/mnt/vmstore/haos/haos.qcow2"
      # extract: true   # optional; auto-detected from file extension when omitted
      checksum: "sha256:a4c320c38109357a5a3d7b42ee26c7cde4704197c9ea7f4c393f1ffca42fe376" # optional but recommended for integrity verification
    # USB passthrough devices (e.g. Zigbee/Matter dongles)
    usb_devices:
      # Nabu Casa ZBT-2
      - vendor_id: "0x303a"
        product_id: "0x831a"
  # Technitium DNS primary — NixOS VM; serves as the writable primary DNS instance
  # - name: technitium-primary
  #   state: absent
  #   vcpu: 2
  #   ram_mb: 2048
  #   mac_address: "52:54:00:c0:01:01"
  #   disk_gb: 32
  #   virtiofs_luks_key:
  #     enable: true
  #   disk_image:
  #     dest: "/mnt/vmstore/technitium-primary/disk.qcow2"
  #     build: true
  # Technitium DNS secondary — NixOS VM; read-only replica replicating zones from primary
  - name: technitium-secondary
    state: present
    vcpu: 2
    ram_mb: 2048
    mac_address: "52:54:00:c0:01:02"
    disk_gb: 32
    virtiofs_luks_key:
      enable: true
    disk_image:
      dest: "/mnt/vmstore/technitium-secondary/disk.qcow2"
      build: false
  - name: apps
    vcpu: 4
    ram_mb: 8192
    mac_address: "52:54:00:00:00:01"
    disk_gb: 300
    virtiofs_luks_key:
      enable: true
    disk_image:
      dest: "/mnt/vmstore/apps/disk.qcow2"
      build: false
    # Intel iGPU (QuickSync), passed through for Jellyfin hardware transcoding.
    # Hardware-specific — re-derive via `lspci -nn` when this moves to prod hardware.
    pci_devices:
      - domain: "0x0000"
        bus: "0x00"
        slot: "0x02"
        function: "0x0"
