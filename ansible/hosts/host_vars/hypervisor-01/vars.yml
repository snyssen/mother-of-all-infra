# VM definitions managed by the libvirt-provision playbook (keys documented in
# docs/operations/vm-deployment.md and the libvirt_provision role's defaults). haos and
# technitium-secondary were moved here as existing images, so neither is built: provisioning
# uses an image already at `dest` as-is.
libvirt_vms:
  # Home Assistant OS appliance (qcow2 image). The URL is only a fallback: it is fetched
  # when nothing is at `dest`, i.e. if haos is rebuilt from scratch and restored from an
  # HA backup.
  - name: haos
    vcpu: 1
    ram_mb: 2048
    mac_address: "52:54:00:12:34:56"
    disk_gb: 64
    disk_image:
      url: "https://github.com/home-assistant/operating-system/releases/download/17.1/haos_ova-17.1.qcow2.xz"
      dest: "/mnt/vmstore/haos/haos.qcow2"
      checksum: "sha256:a4c320c38109357a5a3d7b42ee26c7cde4704197c9ea7f4c393f1ffca42fe376"
    usb_devices:
      # Nabu Casa ZBT-2, moved over with the VM
      - vendor_id: "0x303a"
        product_id: "0x831a"
  # Technitium DNS secondary. Its disk only unlocks with
  # /var/lib/vm-keys/technitium-secondary/luks.key; provisioning only generates a key
  # when none is there.
  - name: technitium-secondary
    state: present
    vcpu: 1
    ram_mb: 2048
    mac_address: "52:54:00:c0:01:02"
    disk_gb: 32
    virtiofs_luks_key:
      enable: true
    disk_image:
      dest: "/mnt/vmstore/technitium-secondary/disk.qcow2"
      build: false
  - name: apps-01
    vcpu: 12
    ram_mb: 49152
    # apps-01's static LAN address is matched on this MAC (nix/hosts/apps-01/network.nix).
    mac_address: "52:54:00:00:00:01"
    disk_gb: 1000
    virtiofs_luks_key:
      enable: true
    disk_image:
      dest: "/mnt/vmstore/apps-01/disk.qcow2"
      # Deployed. Set to true only to rebuild from scratch: that means new host keys
      # (and so new SOPS recipients) — see docs/operations/backups.md, disaster recovery.
      build: false
    # The i5-13400's iGPU (QuickSync), passed through for Jellyfin. Intel iGPUs sit at
    # 0000:00:02.0 (`lspci -nn`); it must be alone in its IOMMU group.
    pci_devices:
      - domain: "0x0000"
        bus: "0x00"
        slot: "0x02"
        function: "0x0"
