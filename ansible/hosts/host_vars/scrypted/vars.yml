ansible_user: "{{ vault_ansible_user }}"
ansible_become_pass: "{{ vault_ansible_become_pass }}"

# Shared secret used by the Scrypted container to authenticate webhook update
# calls to the watchtower sidecar. Must match in both containers.
# Define vault_scrypted__watchtower_token in the encrypted vault.yml for this host.
scrypted__watchtower_token: "{{ vault_scrypted__watchtower_token }}"

# DNS servers used inside the Scrypted and Watchtower containers.
# Public resolvers are recommended by Scrypted upstream to prevent local DNS
# from blocking npm registry and plugin sources. Override here if desired.
# scrypted__dns_servers:
#   - 1.1.1.1
#   - 8.8.8.8

# Scrypted runs on a dedicated VM; override the global vault-backed default
# with a sensible local path for persistent container data.
docker_mounts_directory: /var/lib/scrypted/volumes
