# Technitium DNS Server API configuration for the primary instance.
# The API host uses HTTP on port 5380 for initial setup (before HTTPS is enabled by clustering).
# After cluster initialization, HTTPS on port 53443 is automatically enabled.
technitium_dns_setup_api_host: technitium-primary
technitium_dns_setup_api_port: 5380

# technitium_dns_setup_admin_password (the web UI admin password, which replaces the
# default "admin" on first run) is in secrets.sops.yaml next to this file.

# Role of this node in the Technitium cluster.
technitium_dns_setup_cluster_role: primary

# Fully-qualified domain name used to identify the Technitium cluster.
# This is a Technitium-internal name and cannot be changed after initialization.
# Example: "dns-cluster.internal.example.com"
technitium_dns_setup_cluster_domain: "taild023c5.ts.net"

# IP address of this primary node that is reachable by
# all secondary nodes. Use the Tailscale IP (100.x.x.x) range.
technitium_dns_setup_cluster_primary_ip_address: "100.117.7.65"

# Use a Tailscale-issued certificate (converted to PKCS#12) for Technitium HTTPS.
technitium_dns_setup_tls_enable_managed_certificate: true
technitium_dns_setup_tls_certificate_path: "/var/lib/technitium-dns-server/certs/technitium-cluster.pfx"
technitium_dns_setup_tls_port: 53443
