ansible_user: "{{ vault_ansible_user }}"
ansible_become_pass: "{{ vault_ansible_become_pass }}"

# Technitium DNS Server API configuration for the primary instance.
# The API host uses HTTP on port 5380 for initial setup (before HTTPS is enabled by clustering).
# After cluster initialization, HTTPS on port 53443 is automatically enabled.
technitium_api_host: "http://technitium-primary:5380"

# Admin password for the Technitium web UI.
# On first run this password replaces the default "admin" password.
# Stored in vault as vault_technitium_admin_password.
technitium_admin_password: "{{ vault_technitium_admin_password }}"

# Role of this node in the Technitium cluster.
technitium_cluster_role: primary

# Fully-qualified domain name used to identify the Technitium cluster.
# This is a Technitium-internal name and cannot be changed after initialization.
# Example: "dns-cluster.internal.example.com"
# TODO: set to your desired cluster domain name
technitium_cluster_domain: ""

# List of IP addresses of this primary node that are reachable by
# all secondary nodes. Use the Tailscale IP (100.x.x.x) range.
# TODO: set to the primary VM's Tailscale IP
technitium_cluster_primary_ip_addresses: []

