- hosts: apps
  vars_prompt:
    - name: cmd
      prompt: |-
        Command to execute through cscli
      private: false
  tasks:
    - name: "Executing: cscli {{ cmd }}"
      community.docker.docker_container_exec:
        container: crowdsec
        command: "cscli {{ cmd }}"
      register: returned_value

    - name: Showing stdoud
      ansible.builtin.debug:
        var: returned_value.stdout_lines
