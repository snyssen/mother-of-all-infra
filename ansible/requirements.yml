# Every collection and role is pinned; Renovate's ansible-galaxy manager bumps them.
# community.docker is used by the snyssen.compose_deploy role, not by the repo's own roles.
collections:
  - name: ansible.posix
    source: https://galaxy.ansible.com
    version: "2.2.0"
  - name: community.general
    source: https://galaxy.ansible.com
    version: "12.6.1"
  - name: community.docker
    source: https://galaxy.ansible.com
    version: "5.2.0"
  - name: community.sops
    source: https://galaxy.ansible.com
    version: "2.3.0"
  - name: artis3n.tailscale
    source: https://galaxy.ansible.com
    version: "1.2.0"
  - name: effectivelywild.technitium_dns
    source: https://galaxy.ansible.com
    version: "1.1.2"

roles:
  - name: snyssen.oh-my-zsh-p10k
    src: snyssen.oh-my-zsh-p10k
    version: v1.0.1
  - name: snyssen.compose_deploy
    src: snyssen.compose_deploy
    version: v2.1.0
  - name: undergreen.prometheus-node-exporter
    src: undergreen.prometheus-node-exporter
    version: v1.5.1
  - name: geerlingguy.docker
    src: geerlingguy.docker
    version: "8.0.1"
  - name: geerlingguy.security
    src: geerlingguy.security
    version: "3.1.0"
