site_name: Mother of All Infra Documentation
use_directory_urls: false
theme:
  name: material
  features:
    # Lets a section's index.md (listed first, untitled, in nav) act as its landing page
    - navigation.indexes
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      media: "(prefers-color-scheme: light)"
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
      media: "(prefers-color-scheme: dark)"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - callouts

nav:
  - Home: index.md
  - Architecture:
      - Network: architecture/network.md
      - Hypervisor: architecture/hypervisor.md
      - Secrets: architecture/secrets.md
      - Repository layout: architecture/repository.md
  - Operations:
      - Hypervisor operations: operations/hypervisor.md
      - VM deployment: operations/vm-deployment.md
      - New machine:
          - operations/new-machine/index.md
          - Pre-deployment: operations/new-machine/pre-deployment.md
          - Deployment: operations/new-machine/deployment.md
          - Post-deployment: operations/new-machine/post-deployment.md
      - Full disk encryption: operations/disk-encryption.md
      - Backups: operations/backups.md
  - Services:
      - services/index.md
      - Monitoring: services/monitoring.md
      - Scanner to Paperless: services/scanner-to-paperless.md
  - Modules:
      - libvirtd: modules/libvirtd.md
      - NFS exports: modules/nfs-exports.md
      - Printing: modules/printing.md
  - Plans:
      - plans/index.md
      - CrowdSec AppSec on ingress: plans/crowdsec-appsec.md
      - Rootless containers: plans/rootless-containers.md
  - Archive:
      - archive/index.md
      - apps migration plan: archive/apps-migration-plan.md
      - Phase B cutover: archive/apps-migration-phase-b.md
