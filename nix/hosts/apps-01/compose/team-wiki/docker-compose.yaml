# Mirrors the legacy container_team_wiki role (Wiki.js). Image pin is carried over
# unchanged and is Renovate's to bump.
#
# Stateless container: Wiki.js 2 keeps pages, uploaded assets and its own settings
# (login strategies, site URL...) in Postgres, so there is no volume, as on prod. Its
# /wiki/data is a rebuildable cache.
services:
  team-wiki:
    image: ghcr.io/requarks/wiki:3@sha256:2bdfa19d02d3f0ce18020648cc38ca138c5467fe1cfc4765d4b5f2a59c8efcad
    restart: unless-stopped
    networks:
      - web
      - db
      # Kept from prod: any LDAP strategy configured in the wiki's own settings reaches
      # lldap by that name, which the `auth` stack's service still answers to.
      - ldap
    environment:
      # The central `databases` stack's PostgreSQL; role and database are both
      # `team_wiki`, from that stack's dbNames.
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: team_wiki
      DB_USER: team_wiki
      DB_PASS: ${TEAM_WIKI_DB_PASSWORD}

networks:
  web:
    external: true
  db:
    external: true
  ldap:
    external: true
