# CrowdSec never bans an address on the tailnet. crowdsecurity/whitelists only covers
# RFC1918, not Tailscale's 100.64.0.0/10, and tailnet traffic regularly looks like an
# attack:
#   - apps-01's own services reach each other through Traefik on its tailnet address.
#     argunix pushing to the Nix cache (s3.snyssen.be) does a HEAD before every upload,
#     and the run of 404s for paths not cached yet trips crowdsecurity/http-probing. The
#     ban that followed made the firewall bouncer drop everything from apps-01, cutting
#     the argunix builder off from its coordinator and the bouncer off from the LAPI.
#   - A Matrix client catching up (sync, thumbnails) is a burst of non-static requests:
#     on 2026-11-26 Element on blackfog tripped crowdsecurity/http-crawl-non_statics,
#     and the 4h ban locked it out of the CrowdSec UI and made the backup server's
#     firewall bouncer drop its restic backups.
#   - ingress's AppSec calls and Alloy pushes arrive from its tailnet address.
#
# Every tailnet device is one of ours, and the rest of the stack already trusts the range
# (Authelia, Synapse, Sharkey, the monitoring routes). Public visitors are unaffected:
# apps-01's Traefik trusts ingress's forwarded headers, so they are logged, and banned,
# under their own address. The cost: a compromised tailnet device is never banned.
name: snyssen/apps-01-self-whitelist
description: "Never ban an address on the tailnet"
whitelist:
  reason: "tailnet"
  cidr:
    - "100.64.0.0/10"
