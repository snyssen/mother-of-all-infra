# AppSec (WAF) endpoint the Traefik bouncer plugin forwards requests to — see the
# crowdsec-waf middleware in ../../default.nix. Only reachable over the docker `web`
# network, never published.
source: appsec
listen_addr: 0.0.0.0:7422
appsec_configs:
  - crowdsecurity/appsec-default
labels:
  type: appsec
