services:
  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.2@sha256:65b74942f7e7ed5c60fde4ac15fc4ba715904c398c8b16dd451f4907d90347d4
    restart: unless-stopped
    networks:
      - monitoring
      - web
    volumes:
      - ./crowdsec/config.yaml.local:/etc/crowdsec/config.yaml.local:ro
      - ./crowdsec/acquis.d:/etc/crowdsec/acquis.d:ro
      - ./crowdsec/self-whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/self-whitelist.yaml:ro
      - ./crowdsec/binary-cache-whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/binary-cache-whitelist.yaml:ro
      # Only the declared static config is mounted read-only — the enable-symlinks for
      # collections/parsers installed via COLLECTIONS below land in the container's own
      # writable layer, reinstalled fresh (idempotently) on every start, not a
      # Nix-managed directory. The hub files they point to live in the hub volume below.
      - /var/lib/app-data/crowdsec/data:/var/lib/crowdsec/data
      # Hub content (index + downloaded items) persisted so the entrypoint's own hub
      # update runs on start — it skips it unless .index.json sits on a volume — and a
      # recreated container starts from the last fetched content, not the image's.
      # Seeded from the image's /staging copy on first start (rsync --ignore-existing).
      - /var/lib/app-data/crowdsec/hub:/etc/crowdsec/hub
    environment:
      # Registers each as a valid bouncer API key with the LAPI at startup — one per
      # bouncer identity (this host's own nftables bouncer, and the Traefik plugin's
      # own bouncer instance), matching the legacy setup's approach of one key per
      # bouncer rather than sharing one across bouncer types.
      - BOUNCER_KEY_firewall
      - BOUNCER_KEY_traefik
      # crowdsecurity/linux brings sshd + whitelist-good-actors; crowdsecurity/traefik
      # brings base-http-scenarios + http-cve. The app collections each need a
      # matching acquis.d entry whose `type` label equals the parser's program name.
      # crowdsecurity/nextcloud is deliberately absent: this host's Nextcloud logs via
      # Apache's ErrorLog (see nextcloud/extra-config.nix), whose prefix breaks the
      # parser's JsonExtract on the raw line.
      - COLLECTIONS=crowdsecurity/linux crowdsecurity/traefik LePresidente/authelia LePresidente/jellyfin gauth-fr/immich andreasbrett/paperless-ngx crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      # Never ban RFC1918 sources — a safety net for app logs that report the proxy's
      # docker IP instead of the real client when trusted proxies are misconfigured.
      - PARSERS=crowdsecurity/whitelists

  crowdsec-web-ui:
    image: ghcr.io/theduffman85/crowdsec-web-ui:2026.11.11@sha256:b2c4e13d1a36ab306db090d58efb54ab347ea5616c81badcb5bd8055e5dc4c2c
    restart: unless-stopped
    networks:
      - web
    environment:
      # Default config path is /app/data/config.yaml (inside the same volume as its
      # own runtime SQLite state) — pointed elsewhere instead so the Nix-rendered
      # config (containing OIDC settings) stays separate from that persistent,
      # container-owned data directory.
      - CONFIG_FILE=/etc/crowdsec-web-ui/config.yaml
      - CROWDSEC_LAPI_PASSWORD
    volumes:
      - ${CROWDSEC_WEBUI_CONFIG_PATH}:/etc/crowdsec-web-ui/config.yaml:ro
      - ${CROWDSEC_OIDC_CLIENT_SECRET_PATH}:/run/secrets/oidc_client_secret:ro
      - /var/lib/app-data/crowdsec-web-ui:/app/data

networks:
  monitoring:
    external: true
  web:
    external: true
