services:
  prometheus:
    image: quay.io/prometheus/prometheus:v3.16.0@sha256:9332054523223e2ddc18d8101799d54a4a8d823b030c53216f063a6c117773cd
    restart: unless-stopped
    networks:
      - monitoring
      - web
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=1y"
      - "--web.enable-remote-write-receiver"
    volumes:
      # Rendered by sops (prometheus-config.nix): some scrape jobs carry secrets.
      - ${PROMETHEUS_CONFIG_PATH}:/etc/prometheus/prometheus.yml:ro
      - ./node_rules.yml:/etc/prometheus/node_rules.yml:ro
      - /var/lib/app-data/monitoring/prometheus:/prometheus
    # Loopback only: this host's own Alloy (host-native) pushes here directly.
    # Tailnet hosts push through Traefik's prometheus-write router instead (see
    # default.nix), so no wider publish is needed.
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 2g

  grafana:
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    restart: unless-stopped
    networks:
      - monitoring
      - web
    volumes:
      - /var/lib/app-data/monitoring/grafana:/var/lib/grafana
    # Values that are themselves secrets (or could contain arbitrary characters) are
    # forwarded bare rather than via ${VAR} compose interpolation, which would
    # mis-parse a literal `$` in a password; the env file below already combines
    # them into the exact values Grafana expects.
    environment:
      - GF_INSTALL_PLUGINS=volkovlabs-rss-datasource
      - GF_SERVER_ROOT_URL
      - GF_ANALYTICS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST
      - GF_SMTP_USER
      - GF_SMTP_PASSWORD
      - GF_SMTP_FROM_ADDRESS
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Authelia
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email groups
      - GF_AUTH_GENERIC_OAUTH_EMPTY_SCOPES=false
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL
      - GF_AUTH_GENERIC_OAUTH_API_URL
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
      - GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH=groups
      - GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH=name
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups, 'sysadmin') && 'GrafanaAdmin' || contains(groups, 'sysviewer') && 'Viewer'
      - GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN=true
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT=false
    mem_limit: 256m

  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - /var/lib/app-data/monitoring/loki:/loki
    networks:
      - monitoring
      # Traefik's network: without it the `loki` router has no way to reach this
      # container and every push from another host gets a 502.
      - web
    # Routed through reverse-proxy (see default.nix's `loki` router, tailnet-whitelist
    # gated) so tailnet hosts other than this one can push logs in too — it has no
    # built-in auth (auth_enabled: false), hence the IP allowlist instead of Authelia.
    # Still published to loopback as well: this host's own grafana-alloy and Grafana
    # (as a datasource) both reach it directly without going through Traefik.
    ports:
      - "127.0.0.1:3100:3100"
    mem_limit: 2g

  # Uptime checks, replacing prod's Uptime Kuma. Its whole config is the monitor list,
  # rendered by sops (gatus-config.nix): the push endpoints carry a token.
  gatus:
    image: ghcr.io/twin/gatus:v5.38.0@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
    restart: unless-stopped
    networks:
      - monitoring
      - web
    # The services native to the host (Backrest, Syncthing) are checked where Traefik
    # reaches them.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${GATUS_CONFIG_PATH}:/config/config.yaml:ro
      - /var/lib/app-data/monitoring/gatus:/data
    mem_limit: 128m

  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.13.2@sha256:611cacc80f53fe289f7e7bfe301032a117fb57e790c37272ee05f3b0eba690a3
    restart: unless-stopped
    networks:
      - web
      - db
    environment:
      - DATABASE_URL
      - DATABASE_TYPE=postgresql
      - APP_SECRET
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Relays Grafana alerts to ntfy. Grafana's contact point lives in its database,
  # imported from prod, and reaches this by the name prod's container had
  # (grafana-to-ntfy, port 8080), authenticating with BAUTH_*: the `monitoring` user, as
  # on prod. Same image and settings as the legacy container_monitoring role, except
  # that it reaches ntfy directly on the shared `monitoring` network rather than
  # through Traefik, so alerts don't depend on the reverse proxy being up.
  #
  # Upstream now calls it unnecessary: ntfy >= 2.14 takes Grafana webhooks itself
  # (`/<topic>?template=grafana`). Kept so the imported contact point works unchanged.
  # TODO: remove and configure Grafana to contact to ntfy directly
  grafana-to-ntfy:
    image: kittyandrew/grafana-to-ntfy@sha256:f0d9d5181abc67af71de2dffa19b4971f9e9214de69ac85a43fba218f9071102
    restart: unless-stopped
    # Forwarded bare, as for Grafana above: the topic name and password are secrets.
    environment:
      - NTFY_URL
      - NTFY_BAUTH_USER=monitoring
      - NTFY_BAUTH_PASS
      - BAUTH_USER=monitoring
      - BAUTH_PASS
      - MARKDOWN=true
    networks:
      - monitoring

networks:
  monitoring:
    external: true
  web:
    external: true
  db:
    external: true
