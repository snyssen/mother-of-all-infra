# promtool unit tests for ../rules/alerts.yml, run by the `monitoring` flake check
# (nix/checks/monitoring.nix). Outside the rules folder on purpose: Prometheus loads
# every *.yml in there.
rule_files:
  - ../rules/alerts.yml

evaluation_interval: 30s

tests:
  # Warning at 80% full, both levels at 97%.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="apps", device="/dev/sda1", mountpoint="/"}'
        values: "100x20"
      - series: 'node_filesystem_avail_bytes{instance="apps", device="/dev/sda1", mountpoint="/"}'
        values: "20x9 3x10"
      # Excluded mount points never alert, however full.
      - series: 'node_filesystem_size_bytes{instance="apps", device="tmpfs", mountpoint="/run/user/1000"}'
        values: "100x20"
      - series: 'node_filesystem_avail_bytes{instance="apps", device="tmpfs", mountpoint="/run/user/1000"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 8m
        alertname: FilesystemUsage
        exp_alerts:
          - exp_labels:
              severity: warning
              priority: low
              instance: apps
              device: /dev/sda1
            exp_annotations:
              summary: "/dev/sda1 on apps is 80% full"
              dashboard_uid: cdhmlrmcs2txcb
      - eval_time: 18m
        alertname: FilesystemUsage
        exp_alerts:
          - exp_labels:
              severity: warning
              priority: low
              instance: apps
              device: /dev/sda1
            exp_annotations:
              summary: "/dev/sda1 on apps is 97% full"
              dashboard_uid: cdhmlrmcs2txcb
          - exp_labels:
              severity: critical
              priority: high
              instance: apps
              device: /dev/sda1
            exp_annotations:
              summary: "/dev/sda1 on apps is 97% full"
              dashboard_uid: cdhmlrmcs2txcb

  - interval: 1m
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="apps", chip="platform_coretemp_0", sensor="temp1"}'
        values: "90x20"
    alert_rule_test:
      - eval_time: 3m
        alertname: CpuTemperature
        exp_alerts: []
      - eval_time: 10m
        alertname: CpuTemperature
        exp_alerts:
          - exp_labels:
              severity: warning
              priority: low
              instance: apps
              chip: platform_coretemp_0
              sensor: temp1
            exp_annotations:
              summary: "CPU on apps is at 90°C"
              dashboard_uid: cdhmlrmcs2txcb

  # Five container ids for one name within 10 minutes.
  - interval: 1m
    input_series:
      - series: 'container_last_seen{instance="apps", name="flappy", id="/docker/1"}'
        values: "1 1 _ _ _ _ _ _ _ _ _ _"
      - series: 'container_last_seen{instance="apps", name="flappy", id="/docker/2"}'
        values: "_ _ 1 1 _ _ _ _ _ _ _ _"
      - series: 'container_last_seen{instance="apps", name="flappy", id="/docker/3"}'
        values: "_ _ _ _ 1 1 _ _ _ _ _ _"
      - series: 'container_last_seen{instance="apps", name="flappy", id="/docker/4"}'
        values: "_ _ _ _ _ _ 1 1 _ _ _ _"
      - series: 'container_last_seen{instance="apps", name="flappy", id="/docker/5"}'
        values: "_ _ _ _ _ _ _ _ 1 1 1 1"
      - series: 'container_last_seen{instance="apps", name="steady", id="/docker/6"}'
        values: "1x11"
    alert_rule_test:
      - eval_time: 10m
        alertname: ContainerRestartLoop
        exp_alerts:
          - exp_labels:
              severity: warning
              priority: min
              instance: apps
              name: flappy
            exp_annotations:
              summary: "flappy on apps restarted 4 times in 10 minutes"
              dashboard_uid: b2915c74-bd32-4b38-88ac-37fa532073cd

  - interval: 30s
    input_series:
      - series: 'gatus_results_endpoint_success{group="apps", name="nextcloud", instance="gatus:8080"}'
        values: "1 0 0 0"
      - series: 'gatus_results_endpoint_success{group="apps", name="jellyfin", instance="gatus:8080"}'
        values: "1 1 1 1"
    alert_rule_test:
      - eval_time: 90s
        alertname: EndpointDown
        exp_alerts:
          - exp_labels:
              severity: error
              priority: default
              group: apps
              name: nextcloud
            exp_annotations:
              summary: "apps/nextcloud is failing its Gatus check"
              dashboard_uid: CN8E-vZ7k1

  # Workstation endpoints are not EndpointDown's: a stale backup heartbeat alerts only
  # while the workstation is up, and only after an hour of it.
  - interval: 1m
    input_series:
      - series: 'gatus_results_endpoint_success{group="workstations", name="blackfog", instance="gatus:8080"}'
        values: "0x150"
      # Off for the first hour (no samples at all, as when Alloy stops pushing), then on.
      - series: 'up{job="node", instance="blackfog"}'
        values: "_x60 1x90"
    alert_rule_test:
      - eval_time: 30m
        alertname: EndpointDown
        exp_alerts: []
      - eval_time: 50m
        alertname: WorkstationBackupStale
        exp_alerts: []
      # Up since minute 60: not an hour yet.
      - eval_time: 100m
        alertname: WorkstationBackupStale
        exp_alerts: []
      - eval_time: 125m
        alertname: WorkstationBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              priority: default
              group: workstations
              name: blackfog
            exp_annotations:
              summary: "blackfog has not reported a successful backup job while blackfog is up"
              dashboard_uid: CN8E-vZ7k1

  - interval: 1m
    input_series:
      - series: 'up{job="gatus", instance="gatus:8080"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: warning
              priority: default
              job: gatus
              instance: gatus:8080
            exp_annotations:
              summary: "gatus target gatus:8080 is down"

  # SMART health check flips to failed.
  - interval: 1m
    input_series:
      - series: 'smartctl_device_smart_status{instance="hv", device="ata-ST16000NM000J-2TW103_ZR58BLR6"}'
        values: "1x4 0x20"
      - series: 'smartctl_device_smart_status{instance="hv", device="nvme-KINGSTON_SNV3S1000G_X"}'
        values: "1x24"
    alert_rule_test:
      - eval_time: 10m
        alertname: DiskSmartFailed
        exp_alerts: []
      - eval_time: 20m
        alertname: DiskSmartFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              priority: high
              instance: hv
              device: ata-ST16000NM000J-2TW103_ZR58BLR6
            exp_annotations:
              summary: "ata-ST16000NM000J-2TW103_ZR58BLR6 on hv fails its SMART health check: replace it"
              dashboard_uid: disk-health

  # Unreadable sectors alert on growth, 0 -> 1 included, and go quiet a day later
  # even if the sector is still pending. A constant non-zero count never alerts, and
  # neither does a Seagate's huge, packed Raw_Read_Error_Rate (attribute 1).
  - interval: 5m
    input_series:
      - series: 'smartctl_device_attribute{instance="hv", device="ata-A", attribute_id="197", attribute_name="Current_Pending_Sector", attribute_value_type="raw", attribute_flags_short="-O--CK"}'
        values: "0x300 1x300"
      - series: 'smartctl_device_attribute{instance="hv", device="ata-B", attribute_id="198", attribute_name="Offline_Uncorrectable", attribute_value_type="raw", attribute_flags_short="----CK"}'
        values: "2x600"
      - series: 'smartctl_device_attribute{instance="hv", device="ata-A", attribute_id="1", attribute_name="Raw_Read_Error_Rate", attribute_value_type="raw", attribute_flags_short="POSR--"}'
        values: "180000000+1000000x600"
    alert_rule_test:
      - eval_time: 1495m
        alertname: DiskUnreadableSectors
        exp_alerts: []
      - eval_time: 1510m
        alertname: DiskUnreadableSectors
        exp_alerts:
          - exp_labels:
              severity: warning
              priority: default
              instance: hv
              device: ata-A
              attribute_name: Current_Pending_Sector
            exp_annotations:
              summary: "ata-A on hv has 1 Current_Pending_Sector (up in the last day)"
              description: >-
                The disk could not read some sectors. btrfs repairs the data from the other
                copy. Scrub the pool and run a long SMART self-test; replace the disk if the
                count keeps rising or reallocated sectors follow.
              dashboard_uid: disk-health
      - eval_time: 2960m
        alertname: DiskUnreadableSectors
        exp_alerts: []

  # "Grew in the last day": a Seagate's packed Command_Timeout (188) raw value
  # (0x0001_0001_0001) is huge but constant, so it stays quiet until a counter in it
  # moves. A non-zero but constant reallocated count stays quiet too.
  - interval: 5m
    input_series:
      - series: 'smartctl_device_attribute{instance="hv", device="ata-A", attribute_id="188", attribute_name="Command_Timeout", attribute_value_type="raw"}'
        values: "4295032833x300 4295032834x10"
      - series: 'smartctl_device_attribute{instance="hv", device="ata-A", attribute_id="5", attribute_name="Reallocated_Sector_Ct", attribute_value_type="raw"}'
        values: "8x310"
    alert_rule_test:
      - eval_time: 1495m
        alertname: DiskCommandTimeouts
        exp_alerts: []
      - eval_time: 1510m
        alertname: DiskCommandTimeouts
        exp_alerts:
          - exp_labels:
              severity: warning
              priority: low
              instance: hv
              device: ata-A
            exp_annotations:
              summary: "ata-A on hv had command timeouts in the last day"
              description: Check the disk's SATA and power cables first.
              dashboard_uid: disk-health
      - eval_time: 1510m
        alertname: DiskReallocatedSectors
        exp_alerts: []

  # HDD and NVMe have different temperature thresholds.
  - interval: 1m
    input_series:
      - series: 'smartctl_device_temperature{instance="hv", device="ata-A", temperature_type="current"}'
        values: "55x20"
      - series: 'smartctl_device_temperature{instance="hv", device="nvme-B", temperature_type="current"}'
        values: "55x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: DiskTemperature
        exp_alerts:
          - exp_labels:
              severity: warning
              priority: low
              instance: hv
              device: ata-A
            exp_annotations:
              summary: "ata-A on hv is at 55°C"
              dashboard_uid: disk-health

  - interval: 5m
    input_series:
      - series: 'smartctl_device_percentage_used{instance="hv", device="nvme-B"}'
        values: "85x30"
    alert_rule_test:
      - eval_time: 2h
        alertname: NvmeWear
        exp_alerts:
          - exp_labels:
              severity: warning
              priority: low
              instance: hv
              device: nvme-B
            exp_annotations:
              summary: "nvme-B on hv has used 85% of its rated endurance"
              dashboard_uid: disk-health

  # SMART data that stops arriving.
  - interval: 5m
    input_series:
      - series: 'smartctl_device_smart_status{instance="hv", device="ata-A"}'
        values: "1x12"
    alert_rule_test:
      - eval_time: 80m
        alertname: SmartMetricsMissing
        exp_alerts: []
      - eval_time: 2h
        alertname: SmartMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              priority: default
              instance: hv
            exp_annotations:
              summary: "No SMART data from hv for 30 minutes"
              description: Check prometheus-smartctl-exporter.service and alloy.service on the host.
              dashboard_uid: disk-health

  # A btrfs error counter that already sits at 1 stays quiet; it alerts once it grows.
  - interval: 5m
    input_series:
      - series: 'node_btrfs_device_errors_total{instance="hv", device="crypt-bulk-1", type="write", uuid="u", btrfs_dev_uuid="b1"}'
        values: "1x19 2x5"
    alert_rule_test:
      - eval_time: 90m
        alertname: BtrfsDeviceErrors
        exp_alerts: []
      - eval_time: 105m
        alertname: BtrfsDeviceErrors
        exp_alerts:
          - exp_labels:
              severity: error
              priority: default
              instance: hv
              device: crypt-bulk-1
              btrfs_dev_uuid: b1
              type: write
            exp_annotations:
              summary: "btrfs recorded write errors on crypt-bulk-1 (hv)"
              description: >-
                See `btrfs device stats` and the kernel log on the host. With RAID1, btrfs
                repairs from the other copy; repeated errors on one device point at a failing
                disk or cable.
              dashboard_uid: disk-health

  # The same device, renamed from its mapper name to dm-3 mid-hour, then growing under
  # dm-3: alerts under the mapper name, once.
  - interval: 5m
    input_series:
      - series: 'node_btrfs_device_errors_total{instance="hv", device="crypt-bulk-1", type="write", uuid="u", btrfs_dev_uuid="b1"}'
        values: "1x6"
      - series: 'node_btrfs_device_errors_total{instance="hv", device="dm-3", type="write", uuid="u", btrfs_dev_uuid="b1"}'
        values: "_x6 1 1 3 3"
      - series: 'node_disk_device_mapper_info{instance="hv", device="dm-3", name="crypt-bulk-1"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 45m
        alertname: BtrfsDeviceErrors
        exp_alerts:
          - exp_labels:
              severity: error
              priority: default
              instance: hv
              device: crypt-bulk-1
              btrfs_dev_uuid: b1
              type: write
            exp_annotations:
              summary: "btrfs recorded write errors on crypt-bulk-1 (hv)"
              description: >-
                See `btrfs device stats` and the kernel log on the host. With RAID1, btrfs
                repairs from the other copy; repeated errors on one device point at a failing
                disk or cable.
              dashboard_uid: disk-health

  # not_after is a Unix timestamp and the test clock starts at 0: 20 days left warns,
  # 6 days left also goes critical, 90 days left stays quiet. Not before `for` is up.
  - interval: 1m
    input_series:
      - series: 'traefik_tls_certs_not_after{instance="ingress", cn="a.example.org", sans="a.example.org", serial="1"}'
        values: "1728000x30"
      - series: 'traefik_tls_certs_not_after{instance="traefik:8080", cn="b.example.org", sans="b.example.org", serial="2"}'
        values: "518400x30"
      - series: 'traefik_tls_certs_not_after{instance="ingress", cn="c.example.org", sans="c.example.org", serial="3"}'
        values: "7776000x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: CertificateExpiring
        exp_alerts: []
      - eval_time: 20m
        alertname: CertificateExpiring
        exp_alerts:
          - exp_labels:
              severity: warning
              priority: default
              instance: ingress
              cn: a.example.org
            exp_annotations:
              summary: "TLS certificate a.example.org on ingress expires in 20 days"
              description: >-
                Traefik has not managed to renew it. Look for "Unable to obtain ACME
                certificate" in that Traefik's logs; a 401 from the DNS provider means its
                API key (Dynu) was disabled or changed.
          - exp_labels:
              severity: warning
              priority: default
              instance: traefik:8080
              cn: b.example.org
            exp_annotations:
              summary: "TLS certificate b.example.org on traefik:8080 expires in 6 days"
              description: >-
                Traefik has not managed to renew it. Look for "Unable to obtain ACME
                certificate" in that Traefik's logs; a 401 from the DNS provider means its
                API key (Dynu) was disabled or changed.
          - exp_labels:
              severity: critical
              priority: high
              instance: traefik:8080
              cn: b.example.org
            exp_annotations:
              summary: "TLS certificate b.example.org on traefik:8080 expires in 6 days"
              description: >-
                Traefik has not managed to renew it. Look for "Unable to obtain ACME
                certificate" in that Traefik's logs; a 401 from the DNS provider means its
                API key (Dynu) was disabled or changed.

  - interval: 1m
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
            exp_annotations:
              summary: Always firing, to prove the alerting pipeline works end to end.

  # ntfy rejects every notification (one failed attempt per 5m group_interval), the
  # dead man's switch fails once: only the sustained failure alerts.
  - interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="alertmanager:9093", integration="webhook", receiver_name="ntfy", reason="clientError"}'
        values: "0+0.2x40"
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="alertmanager:9093", integration="webhook", receiver_name="deadman", reason="serverError"}'
        values: "0x5 1x35"
    alert_rule_test:
      - eval_time: 10m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              priority: high
              integration: webhook
              receiver_name: ntfy
              reason: clientError
            exp_annotations:
              summary: "Alertmanager notifications to ntfy (webhook) are failing: clientError"
              description: >-
                Alerts are not being delivered. Alertmanager logs the cause on its `Notify
                failed` lines: {compose_service="alertmanager"} |= "Notify failed" in Loki.
