# Recording rules. Only the one a dashboard queries is kept: the node-exporter mixin's
# other ones (CPU, memory, disk, network rates) fed the mixin's own dashboards and alerts,
# never imported here, so they cost evaluations and storage for nothing.
groups:
  - name: node-exporter.rules
    rules:
      # node_hwmon_temp_celsius with the chip and sensor names joined in, so a reading can
      # be told apart without knowing hwmon's numbering. Node overview's "Avg chip temp"
      # panel queries it under this name.
      - record: instance:node_hwmon_temp_named_celsius:multiplication
        expr: |
          label_replace(label_replace(node_hwmon_temp_celsius
          * ignoring(chip_name, sensor) group_left(chip_name) node_hwmon_chip_names, "chip_name",
          "unknown-chip-name", "chip_name", "") * ignoring(label,
          chip_name) group_left(label) node_hwmon_sensor_label, "label", "unknown-temp-sensor-name",
          "label", "")
