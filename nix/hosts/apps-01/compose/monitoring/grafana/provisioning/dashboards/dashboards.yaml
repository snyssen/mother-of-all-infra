# Dashboards, provisioned from ../../dashboards: one subfolder per Grafana folder, the
# General folder at the root. Read-only in the UI; to change one, see
# docs/nix/monitoring.md (`just grafana-dashboards-export`).
apiVersion: 1

providers:
  - name: repo
    orgId: 1
    type: file
    allowUiUpdates: false
    # Deleting a file deletes its dashboard: the repo is the whole list.
    disableDeletion: false
    options:
      path: /var/lib/grafana-dashboards
      foldersFromFilesStructure: true
