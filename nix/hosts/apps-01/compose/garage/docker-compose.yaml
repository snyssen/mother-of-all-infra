# Mirrors the legacy container_garage role. Image pins are carried over unchanged and
# are Renovate's to bump.
services:
  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    restart: unless-stopped
    networks:
      - web
      - internal
    volumes:
      - ${GARAGE_CONFIG_PATH}:/etc/garage.toml:ro
      # Metadata is a SQLite database, so local disk; the objects themselves go to the
      # NFS mount.
      - /var/lib/app-data/garage/meta:/var/lib/garage/meta
      - /mnt/bulk/garage/data:/var/lib/garage/data
    environment:
      - GARAGE_DEFAULT_BUCKET=cache
      - GARAGE_DEFAULT_ACCESS_KEY
      - GARAGE_DEFAULT_SECRET_KEY
    # Single node, and the access key, the `cache` bucket and the key's permissions on
    # it are created or checked on every start — so a fresh instance needs no manual
    # setup for them. Website access is the exception, see garage-website in default.nix.
    command: ["/garage", "server", "--single-node", "--default-bucket"]

  garage-ui:
    image: khairul169/garage-webui:1.1.0@sha256:17c793551873155065bf9a022dabcde874de808a1f26e648d4b82e168806439c
    restart: unless-stopped
    depends_on:
      - garage
    networks:
      - web
      - internal
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
    volumes:
      # Read for the admin token.
      - ${GARAGE_CONFIG_PATH}:/etc/garage.toml:ro

networks:
  web:
    external: true
  internal:
