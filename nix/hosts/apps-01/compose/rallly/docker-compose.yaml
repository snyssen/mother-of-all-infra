# Mirrors the legacy container_rallly role. Image pin is carried over unchanged and is
# Renovate's to bump.
#
# Stateless container: polls, users and sessions all live in its `rallly` database.
services:
  rallly:
    image: lukevella/rallly:4.17.1@sha256:2c35b8ec567a403207b4681f037be967f1efd04f06f75d9801841f25b7504e45
    restart: unless-stopped
    networks:
      - db
      - web
    environment:
      - DATABASE_URL
      - SECRET_PASSWORD
      - NEXT_PUBLIC_BASE_URL
      - NOREPLY_EMAIL
      - SUPPORT_EMAIL
      - SMTP_HOST
      - SMTP_PORT
      # STARTTLS on 587, not implicit TLS: nodemailer's secure=true starts TLS from the
      # first byte, which the relay's submission port does not speak.
      - SMTP_SECURE=false
      - SMTP_USER
      - SMTP_PWD

      # Logins go through the team domain's Authelia portal only: no email login and no
      # self-registration (the route also refuses /register, see default.nix).
      - OIDC_NAME=Authelia SSO
      - OIDC_ISSUER_URL
      - OIDC_DISCOVERY_URL
      - OIDC_CLIENT_ID
      - OIDC_CLIENT_SECRET
      - EMAIL_LOGIN_ENABLED=false
      - REGISTRATION_ENABLED=false

networks:
  web:
    external: true
  db:
    external: true
