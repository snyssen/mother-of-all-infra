# Mirrors the legacy container_sharkey role. Image pins are carried over unchanged and
# are Renovate's to bump.
#
# Service names are prod's, underscores included, rather than this host's usual
# hyphenated style: Sharkey's own settings (in its database, so imported as is) may
# address the other containers by name — the DeepLX URL in particular — and
# sharkey_redis is what the config file names.
services:
  sharkey:
    image: registry.activitypub.software/transfem-org/sharkey:2025.4.7@sha256:5bb3c083c657b7568db6f1a439fcd71e789260fbffde06f29e0327fe1dd6b933
    restart: unless-stopped
    depends_on:
      sharkey_redis:
        condition: service_healthy
    volumes:
      # Uploads, and any remote media the instance caches.
      - /mnt/bulk/sharkey/files:/sharkey/files
      - ${SHARKEY_CONFIG_PATH}:/sharkey/.config/default.yml:ro
    networks:
      - internal
      - web
      - db

  sharkey_redis:
    image: redis:8.10.2@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
    restart: unless-stopped
    networks:
      - internal
    volumes:
      # Not a disposable cache: Sharkey's job queues live here, federation deliveries
      # still waiting to go out included.
      - /var/lib/app-data/sharkey/redis:/data
    healthcheck:
      test: "redis-cli ping"
      interval: 5s
      retries: 20

  # Translation backend, reached only from Sharkey.
  sharkey_deeplx:
    image: ghcr.io/owo-network/deeplx:v1.3.1@sha256:f1af0bce495dedd71708317d098a37d4d23ee8f40fe3c634e72cb2e86e6ad93f
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
  web:
    external: true
  db:
    external: true
