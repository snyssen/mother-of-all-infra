services:
  traefik:
    image: traefik:v3.7.19@sha256:a6c0194dda77bcb804824580f36fa7edc56e315b1acfe933366c8b52844a78a4
    restart: unless-stopped
    networks:
      - web
    command:
      - "--api=true"
      - "--api.dashboard=true"
      - "--accesslog=true"
      - "--metrics.prometheus=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"

      - "--entryPoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      # Every port this host exposes to the outside goes through an entrypoint here,
      # even non-HTTP ones, so this file (and the `ports` list below) is the one place
      # that says what is open. Routers for them live in each stack's dynamicConfig.
      - "--entryPoints.minecraft.address=:25565"
      - "--entryPoints.skyrim-together.address=:10578/udp"
      # UniFi device ports (compose/unifi). Inform listens on 8081 because 8080 inside
      # this container is Traefik's own (metrics); the host's 8080 maps to it below.
      - "--entryPoints.unifi-inform.address=:8081"
      - "--entryPoints.unifi-stun.address=:3478/udp"
      - "--entryPoints.unifi-discovery.address=:10001/udp"
      # The one exception: Syncthing runs on the host, not in a container, and opens
      # its own ports there — 22000 (TCP and UDP) and 21027/udp — since Traefik could
      # only pass its end-to-end TLS through. See apps/syncthing.nix.

      - "--entryPoints.websecure.address=:443"
      - "--entrypoints.websecure.forwardedHeaders.trustedIPs=100.120.249.84" # Trust ingress host's tailnet IP
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.http.tls.certResolver=le_main"
      - "--entrypoints.websecure.http.tls.domains[0].main=${MAIN_DOMAIN}"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.${MAIN_DOMAIN}"

      - "--certificatesResolvers.le_main.acme.email=${ACME_EMAIL}"
      - "--certificatesResolvers.le_main.acme.storage=/certs/acme-main.json"
      - "--certificatesresolvers.le_main.acme.caserver=${ACME_CA_SERVER}"
      - "--certificatesResolvers.le_main.acme.tlsChallenge=false"
      - "--certificatesresolvers.le_main.acme.dnschallenge=true"
      - "--certificatesresolvers.le_main.acme.dnschallenge.provider=dynu"
      - "--certificatesresolvers.le_main.acme.dnschallenge.resolvers=9.9.9.9"
      - "--certificatesresolvers.le_main.acme.dnschallenge.delaybeforecheck=30"
      - "--certificatesResolvers.le_main.acme.httpChallenge=false"
      - "--certificatesResolvers.le_main.acme.httpChallenge.entryPoint=web"

      # For domains.team: the team wiki and the team-domain Authelia portal.
      - "--certificatesResolvers.le_team.acme.email=${ACME_EMAIL}"
      - "--certificatesResolvers.le_team.acme.storage=/certs/acme-team.json"
      - "--certificatesresolvers.le_team.acme.caserver=${ACME_CA_SERVER}"
      - "--certificatesResolvers.le_team.acme.tlsChallenge=false"
      - "--certificatesresolvers.le_team.acme.dnschallenge=true"
      - "--certificatesresolvers.le_team.acme.dnschallenge.provider=porkbun"
      - "--certificatesresolvers.le_team.acme.dnschallenge.resolvers=9.9.9.9"
      - "--certificatesresolvers.le_team.acme.dnschallenge.delaybeforecheck=30"
      - "--certificatesResolvers.le_team.acme.httpChallenge=false"
      - "--certificatesResolvers.le_team.acme.httpChallenge.entryPoint=web"
    environment:
      - MAIN_DOMAIN
      - ACME_EMAIL
      - ACME_CA_SERVER
      - DYNU_API_KEY
      - PORKBUN_API_KEY
      - PORKBUN_SECRET_API_KEY
      - LEGO_DISABLE_CNAME_SUPPORT=true # Needed because team_domain has a wildcard CNAME to the apex
    ports:
      - "80:80"
      - "443:443"
      - "25565:25565" # Minecraft, routed to mc-router (compose/minecraft)
      - "10578:10578/udp" # Skyrim Together (compose/skyrim-together)
      - "8080:8081" # UniFi inform (compose/unifi)
      - "3478:3478/udp" # UniFi STUN
      - "10001:10001/udp" # UniFi discovery
    # argunix is a native process on the host, not a container — reachable from
    # inside Traefik via the docker-provided host gateway rather than a docker network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/lib/app-data/reverse-proxy/certs:/certs
      - /var/lib/reverse-proxy/dynamic:/etc/traefik/dynamic:ro

networks:
  web:
    external: true
