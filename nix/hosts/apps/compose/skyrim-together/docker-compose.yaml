# Mirrors the legacy container_skyrim_together role. Image pin is carried over
# unchanged and is Renovate's to bump.
#
# The role's `logs` mount is dropped: the server logs to stdout too, which journald
# (and so Loki) already keeps.
services:
  skyrim-together:
    image: tiltedphoques/st-reborn-server:1.8.4@sha256:de3f43830bdbd1dc77bba042cae6e975ea751288643936c37d3b45bfd277c273
    restart: unless-stopped
    networks:
      - web
    volumes:
      # Generated from sops (default.nix). Read-only works: the server only writes a
      # default STServer.ini when there is none, and never touches an existing one
      # (checked against this image).
      - ${SKYRIM_TOGETHER_CONFIG_PATH}:/st-server/config/STServer.ini:ro
      # Server-side resources, if any are ever added. Nothing on prod backs it up.
      - /var/lib/app-data/skyrim-together/Data:/st-server/Data
      - /etc/localtime:/etc/localtime:ro
    # Kept so `docker attach` reaches the server console (bConsole in the config).
    stdin_open: true
    tty: true

networks:
  web:
    external: true
