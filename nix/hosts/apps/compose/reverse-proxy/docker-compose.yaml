services:
  traefik:
    image: traefik:v3.7.15@sha256:0f6150202bc1fed72a7bd2107460eaa510e5b8a905f3fdb5b84f2c8619c33368
    restart: unless-stopped
    networks:
      - web
    command:
      - "--api=true"
      - "--api.dashboard=true"
      - "--accesslog=true"
      - "--metrics.prometheus=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"

      # Loads the CrowdSec bouncer plugin (used by the crowdsec stack's own routes
      # only for now — see the WAF scope note in crowdsec/default.nix; applying it to
      # other stacks' routers is a deliberate later follow-up, not done here).
      #
      # localPlugins, deliberately, not the remote `experimental.plugins` form: that
      # one calls out to plugins.traefik.io on *every* container start — even with a
      # cached archive, since it revalidates via If-None-Match — and one failed call
      # makes Traefik disable *all* plugins for the lifetime of the process. The
      # middleware then resolves as "invalid middleware type or middleware does not
      # exist" and every route using it breaks, with nothing but a single startup log
      # line to say why. That fired for real on a cold boot: container DNS pointed
      # only at MagicDNS, tailscaled wasn't healthy for another ~36s, and the 10s
      # download timed out. Sources are pinned as a flake input and bind-mounted
      # below instead, so plugin loading touches the network not at all.
      - "--experimental.localPlugins.crowdsec-bouncer.moduleName=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"

      - "--entryPoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      - "--entryPoints.websecure.address=:443"
      - "--entrypoints.websecure.forwardedHeaders.trustedIPs=100.120.249.84" # Trust ingress host's tailnet IP
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.http.tls.certResolver=le_main"
      - "--entrypoints.websecure.http.tls.domains[0].main=${MAIN_DOMAIN}"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.${MAIN_DOMAIN}"

      - "--certificatesResolvers.le_main.acme.email=${ACME_EMAIL}"
      - "--certificatesResolvers.le_main.acme.storage=/certs/acme-main.json"
      - "--certificatesresolvers.le_main.acme.caserver=${ACME_CA_SERVER}"
      - "--certificatesResolvers.le_main.acme.tlsChallenge=false"
      - "--certificatesresolvers.le_main.acme.dnschallenge=true"
      - "--certificatesresolvers.le_main.acme.dnschallenge.provider=porkbun" # TODO: change back to "dynu" once domains.main returns to snyssen.be (then le_argunix below becomes redundant and can be removed)
      - "--certificatesresolvers.le_main.acme.dnschallenge.resolvers=9.9.9.9"
      - "--certificatesresolvers.le_main.acme.dnschallenge.delaybeforecheck=30"
      - "--certificatesResolvers.le_main.acme.httpChallenge=false"
      - "--certificatesResolvers.le_main.acme.httpChallenge.entryPoint=web"

      # TODO: temporary, remove once domains.main returns to snyssen.be. le_main is
      # pointed at the test domain (snyssen1.xyz, Porkbun-managed) for the duration of
      # the parallel-host migration test, but argunix stays pinned to the permanent
      # domain (snyssen.be, Dynu-managed — see argunix_domain in reverse-proxy's
      # default.nix). A single certResolver can only prove ownership through one DNS
      # provider, so argunix's own routes need this separate Dynu-backed resolver
      # instead of le_main.
      - "--certificatesResolvers.le_argunix.acme.email=${ACME_EMAIL}"
      - "--certificatesResolvers.le_argunix.acme.storage=/certs/acme-argunix.json"
      - "--certificatesresolvers.le_argunix.acme.caserver=${ACME_CA_SERVER}"
      - "--certificatesResolvers.le_argunix.acme.tlsChallenge=false"
      - "--certificatesresolvers.le_argunix.acme.dnschallenge=true"
      - "--certificatesresolvers.le_argunix.acme.dnschallenge.provider=dynu"
      - "--certificatesresolvers.le_argunix.acme.dnschallenge.resolvers=9.9.9.9"
      - "--certificatesresolvers.le_argunix.acme.dnschallenge.delaybeforecheck=30"
      - "--certificatesResolvers.le_argunix.acme.httpChallenge=false"
      - "--certificatesResolvers.le_argunix.acme.httpChallenge.entryPoint=web"

      # Not used by any router yet (no team_domain stack converted) — ready for when one is.
      - "--certificatesResolvers.le_team.acme.email=${ACME_EMAIL}"
      - "--certificatesResolvers.le_team.acme.storage=/certs/acme-team.json"
      - "--certificatesresolvers.le_team.acme.caserver=${ACME_CA_SERVER}"
      - "--certificatesResolvers.le_team.acme.tlsChallenge=false"
      - "--certificatesresolvers.le_team.acme.dnschallenge=true"
      - "--certificatesresolvers.le_team.acme.dnschallenge.provider=porkbun"
      - "--certificatesresolvers.le_team.acme.dnschallenge.resolvers=9.9.9.9"
      - "--certificatesresolvers.le_team.acme.dnschallenge.delaybeforecheck=30"
      - "--certificatesResolvers.le_team.acme.httpChallenge=false"
      - "--certificatesResolvers.le_team.acme.httpChallenge.entryPoint=web"
    environment:
      - MAIN_DOMAIN
      - ACME_EMAIL
      - ACME_CA_SERVER
      - DYNU_API_KEY
      - PORKBUN_API_KEY
      - PORKBUN_SECRET_API_KEY
      - LEGO_DISABLE_CNAME_SUPPORT=true # Needed because team_domain has a wildcard CNAME to the apex
    ports:
      - "80:80"
      - "443:443"
    # argunix is a native process on the host, not a container — reachable from
    # inside Traefik via the docker-provided host gateway rather than a docker network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/lib/app-data/reverse-proxy/certs:/certs
      - /var/lib/reverse-proxy/dynamic:/etc/traefik/dynamic:ro
      # Read directly by the crowdsec-bouncer plugin (crowdsecLapiKeyFile, see the
      # crowdsec stack's dynamicConfig fragment) — a raw secret file, not rendered
      # through this stack's own env template, since it's owned/declared by crowdsec.
      - ${CROWDSEC_WAF_BOUNCER_KEY_PATH}:/run/secrets/crowdsec_waf_bouncer_key:ro
      # Traefik resolves local plugins at ./plugins-local/src/<go module path>,
      # relative to its working directory (/ in this image), so the mount point has
      # to spell the module path out exactly — it is how the plugin is identified,
      # not an arbitrary location. Read-only: Yaegi only ever reads these sources.
      - ${CROWDSEC_BOUNCER_PLUGIN_SRC}:/plugins-local/src/github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin:ro

networks:
  web:
    external: true
