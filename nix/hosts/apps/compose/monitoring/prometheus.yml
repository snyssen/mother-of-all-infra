global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "traefik"
    static_configs:
      - targets: ["traefik:8080"]
  - job_name: "uptime"
    scrape_interval: 30s
    scheme: http
    static_configs:
      - targets: ["uptime:3001"]
  - job_name: "crowdsec"
    static_configs:
      - targets: ["crowdsec:6060"]
  - job_name: "ntfy"
    static_configs:
      - targets: ["ntfy:9090"]
  # minecraft-prometheus-exporter plugin on the main server (not mc-usw, which doesn't
  # run it), reached over the shared `monitoring` network.
  - job_name: "minecraft"
    static_configs:
      - targets: ["minecraft:9940"]

  # Deferred until the corresponding host/stack exists on this migration:
  # jellyfin, healthchecks.io, authelia, backup.snyssen.be rest_server,
  # hass. Cross-host metrics/logs (other Nix hosts, the still-live Ubuntu box)
  # are no longer deferred — node/cadvisor metrics arrive via Alloy's remote_write
  # push (see grafana-alloy.nix) from any tailnet host, not scraped here.

rule_files:
  - node_rules.yml
