global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  # node-exporter and cadvisor run natively on this host, reachable from this
  # container via the docker-bridge firewall trust rule (see docker.nix).
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
  - job_name: cadvisor
    static_configs:
      - targets: ["host.docker.internal:9200"]
  - job_name: "traefik"
    static_configs:
      - targets: ["traefik:8080"]
  - job_name: "uptime"
    scrape_interval: 30s
    scheme: http
    static_configs:
      - targets: ["uptime:3001"]

  # Deferred until the corresponding host/stack exists on this migration:
  # minecraft, jellyfin, healthchecks.io, authelia, backup.snyssen.be rest_server,
  # crowdsec, ntfy, hass. Cross-host scraping (other Nix hosts, the still-live
  # Ubuntu box) is also deferred pending a decision on whether this test VM's
  # monitoring stack should reach into other infrastructure at all.

rule_files:
  - node_rules.yml
