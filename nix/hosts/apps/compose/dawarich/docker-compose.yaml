# Mirrors the legacy container_dawarich role, itself derived from upstream's
# https://github.com/Freika/dawarich/blob/master/docker/docker-compose.yml. Image pins
# are carried over unchanged and are Renovate's to bump.
#
# Two of the role's app mounts are dropped, both reproducible from the image:
# - /var/app/public: web-entrypoint.sh copies the image's compiled assets into it on
#   every start. The volume is a leftover from older releases, which wrote exports to
#   public/exports. Exports now go to `storage` (ActiveStorage), with
#   Export#migrate_to_new_storage there to move old ones across, so 1.17.0 writes
#   nothing to public/ that the image doesn't ship.
# - the Postgres data directory at /dawarich_db_data: nothing in Dawarich 1.17.0's
#   app/, lib/ or config/ reads it, and it was the live database mounted read-write
#   into a second container.
services:
  dawarich_redis:
    image: redis:8.10.2@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
    command: >
      redis-server
      --save 900 1
      --save 300 10
      --appendonly no
    networks:
      - internal
    volumes:
      - /var/lib/app-data/dawarich/shared:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  # Dawarich's own PostgreSQL, not the central `databases` stack: it needs PostGIS.
  # Local disk rather than /mnt/bulk, as for Immich's: a live database does not belong
  # on NFS. It joins the `db` network purely so pgAdmin can reach it.
  dawarich_db:
    image: postgis/postgis:17-3.5-alpine@sha256:894f570c0cf0664ed5576a8fd5d5bfb8fb1b19d592885b686c3a88c8bd90c41f
    shm_size: 1G
    volumes:
      - /var/lib/app-data/dawarich/postgres:/var/lib/postgresql/data
      - /var/lib/app-data/dawarich/shared:/var/shared
    networks:
      - internal
      - db
    environment:
      POSTGRES_USER: dawarich
      POSTGRES_PASSWORD: ${DAWARICH_DB_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dawarich -d dawarich"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  dawarich_backups:
    image: prodrigestivill/postgres-backup-local:17@sha256:e803bd9eb4bfb42e9b3e74ba411227f3d55da292905800395659cc579b6641e8
    environment:
      POSTGRES_HOST: dawarich_db
      POSTGRES_USER: dawarich
      POSTGRES_PASSWORD: ${DAWARICH_DB_PASSWORD}
      POSTGRES_DB: dawarich
      POSTGRES_EXTRA_OPTS: "--format c" # So we can use pg_restore to restore the database
      TZ: Europe/Brussels
      HEALTHCHECK_ID: ${DAWARICH_DB_DUMP_HEALTHCHECK_ID}
      SCHEDULE: 30 */4 * * *
      # Same retention as the central and Immich dumps: these exist for a quick restore
      # of *recent* data, and anything older belongs in a restic snapshot. Weeks/months
      # are explicitly disabled rather than left low — the image treats "0" as "keep
      # none of this tier", not "unlimited".
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "0"
      BACKUP_KEEP_MONTHS: "0"
    volumes:
      - /mnt/bulk/backups/dawarich:/backups
      # The shared hook script, passed in by path as for Immich — see
      # DB_BACKUP_HOOKS_PATH in default.nix.
      - ${DB_BACKUP_HOOKS_PATH}:/hooks:ro
    depends_on:
      dawarich_db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  dawarich_app:
    image: freikin/dawarich:1.17.0@sha256:207dc86f8baa8fcf5b585f31186bf81b55added9c102a96f308d640e964ea60f
    volumes:
      # Drop inbox: files placed under watched/<user email>/ are imported, like
      # Paperless's consume directory.
      - /mnt/bulk/dawarich/watched:/var/app/tmp/imports/watched
      # Uploaded import files (GPX, Takeout...) and generated exports. The points
      # themselves are in the database.
      - /mnt/bulk/dawarich/storage:/var/app/storage
    networks:
      - internal
      - web
    stdin_open: true
    tty: true
    entrypoint: web-entrypoint.sh
    command: ["bin/rails", "server", "-p", "3000", "-b", "::"]
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      REDIS_URL: redis://dawarich_redis:6379
      DATABASE_HOST: dawarich_db
      DATABASE_USERNAME: dawarich
      DATABASE_PASSWORD: ${DAWARICH_DB_PASSWORD}
      DATABASE_NAME: dawarich
      MIN_MINUTES_SPENT_IN_CITY: 60
      APPLICATION_HOSTS: ${DAWARICH_HOST}
      TIME_ZONE: Europe/Brussels
      APPLICATION_PROTOCOL: http
      PROMETHEUS_EXPORTER_ENABLED: "false"
      PROMETHEUS_EXPORTER_HOST: 0.0.0.0
      PROMETHEUS_EXPORTER_PORT: 9394
      SELF_HOSTED: "true"
      SECRET_KEY_BASE: ${DAWARICH_SECRET_KEY_BASE}
      # Empty while Photon is off (see default.nix).
      PHOTON_API_HOST: ${DAWARICH_PHOTON_API_HOST}
      PHOTON_API_USE_HTTPS: "false"
      STORE_GEODATA: "true"
      OIDC_CLIENT_ID: ${DAWARICH_OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${DAWARICH_OIDC_CLIENT_SECRET}
      OIDC_ISSUER: ${DAWARICH_OIDC_ISSUER}
      OIDC_REDIRECT_URI: https://${DAWARICH_HOST}/users/auth/openid_connect/callback
      OIDC_AUTO_REGISTER: "true"
      OIDC_PROVIDER_NAME: Authelia
      ALLOW_EMAIL_PASSWORD_REGISTRATION: "false"
      ALLOW_EMAIL_PASSWORD_LOGIN: "false"
      DOMAIN: ${DAWARICH_HOST}
      SMTP_SERVER: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_DOMAIN: ${MAIN_DOMAIN}
      SMTP_USERNAME: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: dawarich@${MAIN_DOMAIN}
      SMTP_AUTHENTICATION: plain
      SIDEKIQ_EMBEDDED: "true"
      WEB_CONCURRENCY: "0"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO - http://127.0.0.1:3000/api/v1/health | grep -q '\"status\"\\s*:\\s*\"ok\"'",
        ]
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s
    depends_on:
      dawarich_db:
        condition: service_healthy
        restart: true
      dawarich_redis:
        condition: service_healthy
        restart: true

  # Reverse geocoder. Only started when the `photon` profile is active, which
  # default.nix controls. Internal only: prod also put it on `web` for Mobilizon, which
  # was retired rather than migrated, so Dawarich is its only client.
  photon:
    image: rtuszik/photon-docker:2.5.0@sha256:c5babeb0ac396b485822036cf3c69e54fb6c79d699328a4e042e11bbd6f73f1a
    profiles:
      - photon
    environment:
      - UPDATE_STRATEGY=${PHOTON_UPDATE_STRATEGY}
      - UPDATE_INTERVAL=720h
    volumes:
      - /var/lib/app-data/dawarich/photon:/photon/data
    restart: unless-stopped
    networks:
      - internal

networks:
  web:
    external: true
  db:
    external: true
  internal:
