# This file is a placeholder for host-specific secrets for the `apps` VM.
# It must be replaced with a proper SOPS-encrypted file before deploying.
#
# Bootstrap procedure:
#   1. Provision and boot the apps VM once (without secrets).
#   2. On the VM, run: just sops-gen-privkey
#   3. Run: just sops-get-pubkey  (copy the printed age public key)
#   4. Add the key to .sops.yaml under the apps host creation rule.
#   5. Replace this file with a properly encrypted secrets.yaml:
#      just sops-update nix/hosts/apps/data/secrets.yaml
#
# Expected secret structure (do NOT commit real secrets in plaintext):
#
# users:
#   snyssen:
#     passwordHash: "<mkpasswd output>"
# tailscale:
#   authKey: "<tailscale auth key>"
# crowdsec-firewall-bouncer:
#   api_key: "<crowdsec api key>"
# restic:
#   repositoryPassword: "<restic repo password>"
# stacks:
#   databases:
#     postgresPassword: "<password>"
#     mariadbRootPassword: "<password>"
#   # ... (add per-stack secrets as stacks are migrated)
placeholder: "REPLACE_WITH_SOPS_ENCRYPTED_SECRETS"
